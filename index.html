ul thing.", "L'innocence est une belle chose."], ["Humans were never meant to live forever.", "Les humains n'ont jamais été faits pour vivre éternellement."], ["I think I have a theory about that.", "Je pense que j'ai une théorie à ce sujet."], ["That is intriguing.", "C'est intriguant."], ["You are saying you intentionally hide your good looks?", "Tu es en train de dire que tu caches intentionnellement ta beauté ?"], ["I do not have an account in these forums.", "Je n’ai pas de compte sur ces forums."], ["I didn't know where it came from.", "Je ne savais pas d'où ça venait."], ["I think my living with you has influenced your way of living.", "Je pense que le fait que j'ai vécu avec toi a influencé la façon dont tu vis."], ["This is not important.", "Ce n'est pas important."], ["I didn't like it.", "Je n'ai pas aimé."], ["She's asking how that's possible.", "Elle demande comment c’est possible."], ["You're just running away from life's problems.", "Tu ne fais que fuir les problèmes de la vie."], ["If you look at the lyrics, they don't really mean much.", "Si tu regardes les paroles, elles ne signifient pas vraiment grand-chose."], ["There's a problem there that you don't see.", "Il y a un problème que tu ne vois pas."], ["You can do it.", "Tu peux le faire !"], ["My physics teacher doesn't care if I skip classes.", "Mon prof de physique s'en fiche si je sèche les cours."], ["I wish I could go to Japan.", "J'aimerais bien pouvoir aller au Japon."], ["I have to go to bed.", "Je dois aller au lit."], ["I won't ask you anything else today.", "Je ne t'en demanderai pas plus pour aujourd'hui."], ["It may freeze next week.", "Il se peut qu'il gèle la semaine prochaine."], ["Even though he apologized, I'm still furious.", "Même s'il s'est excusé, je suis encore en colère."], ["The police will get you to find the bullets.", "La police vous fera trouver les balles."], ["It was not my intention.", "Ce n'était pas mon intention."], ["Thank you for your explanation.", "Merci pou ike you anymore.", "Je ne t'aime plus."], ["I am curious.", "Je suis curieux."], ["I don't want to wait that long.", "Je ne veux pas attendre aussi longtemps."], ["Why don't you come visit us?", "Pourquoi ne viens-tu pas nous voir ?"], ["But the possibility seems unlikely.", "Mais la possibilité semble improbable."], ["I shouldn't have logged off.", "Je n'aurais pas dû me déconnecter."], ["It is inevitable that I go to France someday, I just don't know when.", "C'est inévitable que j'aille en France un jour, je ne sais juste pas quand."], ["I didn't want it to happen.", "Je ne voulais pas que ça arrive."], ["You can probably guess what happens though.", "Tu devines probablement ce qui va arriver."], ["Next thing you know, you'll be in the papers.", "Avant même que tu ne le saches, tu seras dans les journaux."], ["What other options do I have?", "Quelles autres options ai-je ?"], ["I am not much of a traveller.", "Je ne suis pas un grand voyageur."], ["I have nothing better to do.", "Je n'ai rien de mieux à faire."], ["Neither can I explain it.", "Je ne peux pas l'expliquer non plus."], ["Everyone has strengths and weaknesses.", "Tout le monde a ses forces et ses faiblesses."], ["It only shows you're not a robot.", "Ça montre seulement que tu n'es pas un robot."], ["How could I be a robot? Robots don't dream.", "Comment pourrais-je être un robot ? Les robots ne rêvent pas."], ["It's not something anyone can do.", "Ce n'est pas quelque chose que n'importe qui peut faire."], ["I don't know if I still have it.", "Je ne sais pas si je l'ai encore."], ["What do you think I've been doing?", "Qu'est-ce que tu crois que j'étais en train de faire ?"], ["Do not underestimate my power.", "Ne sous-estime pas ma puissance."], ["My mom doesn't speak English very well.", "Ma maman ne parle pas très bien anglais."], ["I don't speak French well enough!", "Je ne parle pas assez bien français !"], ["I was wondering if you were going to show up today.", "Je me demandais si tu allais ven const U=[{"t":"Se présenter : le verbe be et les salutations","rules":[{"h":"Le verbe be (être) au présent","x":"**I am** (I'm), **you are** (you're), **he / she / it is** (he's, she's, it's), **we are** (we're), **they are** (they're).\nNégation : **I'm not, he isn't, they aren't**. Question : on inverse : **Are you a student? — Yes, I am. / No, I'm not.**\nEn anglais le sujet est **toujours** exprimé : *It is cold* (pas « is cold »).\nL'âge se dit avec be : **I am 30** (jamais « I have 30 »).","ex":[["I am Paul and I'm from Lyon.","Je suis Paul et je viens de Lyon."],["She is not a teacher. She is a nurse.","Elle n'est pas enseignante. Elle est infirmière."],["Are you 25? — No, I'm 28.","As-tu 25 ans ? — Non, j'ai 28 ans."]],"q":[["She ___ a doctor.",["is","are","am","be"],"Avec she / he / it : is."],["We ___ from France.",["are","is","am","be"],"Avec we / you / they : are."],["I ___ 30 years old.",["am","have","do","make"],"L'âge se dit avec be."]]},{"h":"Saluer et se présenter","x":"**Hello / Hi** (courant), **Good morning** (jusqu'à midi), **Good afternoon**, **Good evening** (le soir à l'arrivée), **Good night** (en partant se coucher). **How are you?** — **I'm fine, thank you. And you?**\n**Nice to meet you.** — **Nice to meet you too.** **What's your name? — My name is… / I'm…** **Where are you from? — I'm from…**\nPoliesse : **please, thank you, sorry, excuse me, you're welcome.**\nÉpeler : **How do you spell it?**","ex":[["Hello, my name is Anna. Nice to meet you.","Bonjour, je m'appelle Anna. Enchantée."],["How are you? — I'm fine, thanks. And you?","Comment vas-tu ? — Je vais bien, merci. Et toi ?"],["Excuse me, where is the station?","Excusez-moi, où est la gare ?"]],"q":[["The answer to « Nice to meet you » is:",["Nice to meet you too.","You're welcome.","Good night.","I'm fine."],"Réponse naturelle : Nice to meet you too."],["You say it when you leave to go to bed:",["Good night","Good morning","Good afternoon","Hello"],"Good night = bonne nuit."],["« De rien » en réponse à thank you:",["You're welcome.","Excuse me.","Please.","Sorry."],"You're welcome."]]}],"words":[["hello","bonjour, salut","Hello, everyone!"],["goodbye","au revoir","Goodbye, see you tomorrow."],["please","s'il vous plaît","Please sit down."],["thank you","merci","Thank you very much."],["sorry","désolé","Sorry, I'm late."],["name","nom, prénom","My name is Tom."],["from","de (origine)","I'm from Spain."],["student","étudiant","She is a student."],["teacher","enseignant","He is a teacher."],["friend","ami","This is my friend."],["yes","oui","Yes, please."],["no","non","No, thank you."],["man","homme","The man is tall."],["woman","femme","The woman is a doctor."],["morning","matin","Good morning!"],["night","nuit","Good night!"],["one","un","I have one brother."],["ten","dix","There are ten students."],["twenty","vingt","He is twenty."],["country","pays","Which country are you from?"]],"sents":[["My name is Sara and I am a student.","Je m'appelle Sara et je suis étudiante."],["Where are you from?","D'où venez-vous ?"],["I am not from Italy. I am from Spain.","Je ne viens pas d'Italie. Je viens d'Espagne."],["Nice to meet you, Mr Brown.","Enchanté, monsieur Brown."],["Is he your brother?","Est-ce ton frère ?"],["They are my friends from school.","Ce sont mes amis de l'école."]],"lv":"A1","can":"Je sais me présenter et saluer quelqu'un."},{"t":"Articles, pluriels et this / that","rules":[{"h":"a, an, the et le pluriel","x":"**a** devant un son consonne (a book), **an** devant un son voyelle (an apple, an hour). **the** : quand on parle d'une chose précise ou déjà mentionnée.\nPas d'article pour parler de choses en général au pluriel : *I like dogs.*\n**Pluriel** : + s (books) ; + es après s, x, ch, sh (boxes, watches) ; consonne + y → ies (city → cities) ; irréguliers : man → men, woman → women, child → children, person → people, foot → feet.\n**a / an** n'existent pas au pluriel : *a book → books*.","ex":[["I have a car and an umbrella.","J'ai une voiture et un parapluie."],["The car is red.","La voiture est rouge."],["There are three children and two women.","Il y a trois enfants et deux femmes."]],"q":[["She has ___ apple.",["an","a","the a","some an"],"an devant un son voyelle."],["Plural of « city »:",["cities","citys","cityes","city's"],"consonne + y → ies."],["Plural of « child »:",["children","childs","childes","childrens"],"Pluriel irrégulier : children."]]},{"h":"this, that, these, those","x":"**this** (proche, singulier), **these** (proche, pluriel), **that** (éloigné, singulier), **those** (éloigné, pluriel).\n*This is my pen. These are my pens. That is a bus. Those are buses.*\nQuestions : **What is this? — It's a… / What are these? — They are…**\nOn dit aussi **here** (ici) et **there** (là-bas).","ex":[["This is my phone and that is your phone.","Ceci est mon téléphone et cela est ton téléphone."],["These shoes are new.","Ces chaussures sont neuves."],["What are those? — They are keys.","Qu'est-ce que c'est, là-bas ? — Ce sont des clés."]],"q":[["___ books here are mine.",["These","This","That","Those"],"Pluriel proche : these."],["Look at ___ bird over there!",["that","this","these","those"],"Singulier éloigné : that."],["What is ___? — It's a laptop. (in my hands)",["this","that","these","those"],"Singulier proche : this."]]}],"words":[["book","livre","I have a book."],["pen","stylo","Give me a pen."],["bag","sac","My bag is blue."],["key","clé","Where is my key?"],["phone","téléphone","Turn off your phone."],["table","table","The table is big."],["chair","chaise","Sit on the chair."],["door","porte","Close the door."],["window","fenêtre","Open the window."],["car","voiture","His car is old."],["bus","bus","The bus is late."],["apple","pomme","An apple a day."],["house","maison","Their house is small."],["child","enfant","The child is five."],["people","gens","Many people are here."],["here","ici","Come here."],["there","là-bas","Look over there."],["new","neuf, nouveau","A new phone."],["old","vieux, ancien","An old house."],["big","grand","A big table."]],"sents":[["This is a book and that is a pen.","Ceci est un livre et cela est un stylo."],["These are my keys and those are yours.","Ce sont mes clés et celles-là sont les tiennes."],["I have an apple and two oranges.","J'ai une pomme et deux oranges."],["The children are in the garden.","Les enfants sont dans le jardin."],["What is that? — It's a bus.","Qu'est-ce que c'est ? — C'est un bus."],["There are five people in the car.","Il y a cinq personnes dans la voiture."]],"lv":"A1","can":"Je sais désigner des objets et des personnes."},{"t":"La famille, les possessifs et have got","rules":[{"h":"Adjectifs possessifs et 's","x":"**my, your, his, her, its, our, their** s'accordent avec le **possesseur**, pas avec la chose : *his mother* (la mère de lui), *her father*.\nPossession : **'s** pour une personne : *Anna's brother*, *my parents' house*. Pour les choses : *the door of the room*.\nPas d'article avec un possessif : *my car* (pas « the my car »).\nPronoms possessifs : **mine, yours, his, hers, ours, theirs**. *This book is mine.*","ex":[["This is my sister and her husband.","Voici ma sœur et son mari."],["Tom's car is red.","La voiture de Tom est rouge."],["The red bag is hers.","Le sac rouge est à elle."]],"q":[["Anna loves ___ brother.",["her","his","their","its"],"Le possesseur est Anna (elle) : her."],["This is ___ house. (we own it)",["our","ours","we","us"],"Adjectif possessif devant le nom : our."],["Those keys are ___.",["mine","my","me","I"],"Pronom possessif : mine."]]},{"h":"have got et la description de la famille","x":"**have got** (très courant en anglais britannique) = avoir : **I've got, you've got, he's got, we've got**. Négation : **haven't got / hasn't got**. Question : **Have you got a sister?**\nAvec do : **Do you have a sister? — Yes, I do.** (américain et formel).\nOn ne dit pas « I have 2 brothers » mais bien **I have two brothers** (ou I've got).\nFamille : **parents, mother / mum, father / dad, brother, sister, son, daughter, grandmother, grandfather, uncle, aunt, cousin, husband, wife.**","ex":[["I've got two brothers and one sister.","J'ai deux frères et une sœur."],["She hasn't got any children.","Elle n'a pas d'enfants."],["Have you got a big family?","Tu as une grande famille ?"]],"q":[["He ___ got a new bike.",["has","have","is","does"],"he / she / it → has got."],["Have you ___ any brothers?",["got","get","gotten to","getting"],"Have you got…?"],["The son of your aunt is your ___.",["cousin","uncle","brother","nephew"],"cousin = cousin(e)."]]}],"words":[["family","famille","I love my family."],["mother","mère","My mother is a nurse."],["father","père","His father works here."],["brother","frère","I have one brother."],["sister","sœur","Her sister is twelve."],["son","fils","Their son is a student."],["daughter","fille","My daughter is five."],["husband","mari","Her husband is tall."],["wife","épouse","His wife is kind."],["grandmother","grand-mère","My grandmother is 80."],["grandfather","grand-père","My grandfather is funny."],["uncle","oncle","My uncle lives in Paris."],["aunt","tante","My aunt is a teacher."],["cousin","cousin(e)","My cousin is my age."],["parents","parents","My parents are at home."],["baby","bébé","The baby is sleeping."],["young","jeune","A young man."],["married","marié","She is married."],["single","célibataire","He is single."],["age","âge","What's your age?"]],"sents":[["I've got two sisters and a brother.","J'ai deux sœurs et un frère."],["My parents' house is near the sea.","La maison de mes parents est près de la mer."],["Her husband is a doctor and his sister is a teacher.","Son mari est médecin et sa sœur est enseignante."],["Have you got any children?","As-tu des enfants ?"],["This is my uncle's car. It's not mine.","C'est la voiture de mon oncle. Ce n'est pas la mienne."],["My grandmother is eighty years old.","Ma grand-mère a quatre-vingts ans."]],"lv":"A1","can":"Je sais parler de ma famille et de ce que j'ai."},{"t":"Le présent simple : routine et habitudes","rules":[{"h":"Forme affirmative et orthographe du s","x":"Le **présent simple** exprime les habitudes, les vérités générales et les horaires.\n**I / you / we / they + base** : *I work.* **he / she / it + base + s** : *She works.*\nOrthographe : **+ es** après s, x, ch, sh, o (watches, goes, does) ; consonne + y → **ies** (study → studies) ; voyelle + y → + s (plays) ; **have → has**.\nSignaux : every day, always, usually, often, sometimes, never, on Mondays.","ex":[["I get up at seven every day.","Je me lève à sept heures tous les jours."],["She studies English on Mondays.","Elle étudie l'anglais le lundi."],["He has breakfast at eight.","Il prend son petit déjeuner à huit heures."]],"q":[["She ___ to work by bus.",["goes","go","gos","going"],"he/she/it + s ; go → goes."],["My brother ___ in a bank.",["works","work","working","is work"],"3e personne : works."],["He ___ English at school. (study)",["studies","studys","study","studyes"],"consonne + y → ies."]]},{"h":"L'heure et les jours","x":"**What time is it? — It's seven o'clock / half past seven / quarter past seven / quarter to eight / ten past three.**\nPréposition : **at** + heure (at 6), **on** + jour (on Monday), **in** + matin / après-midi / soir (in the morning), mais **at night**.\nJours : Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday (majuscule). Moments : **every day, at the weekend (UK) / on the weekend (US)**.\nRoutine : get up, have breakfast, go to work, start work, have lunch, finish work, go home, have dinner, go to bed.","ex":[["I start work at nine o'clock.","Je commence à travailler à neuf heures."],["We have lunch at half past twelve.","Nous déjeunons à midi et demi."],["She goes to bed at quarter to eleven.","Elle se couche à onze heures moins le quart."]],"q":[["I see my friends ___ Saturday.",["on","at","in","by"],"on + jour."],["The film starts ___ 8 p.m.",["at","on","in","by"],"at + heure."],["7:30 is also said:",["half past seven","half to seven","seven and half to","seven thirty to"],"half past seven."]]}],"words":[["to wake up","se réveiller","I wake up at six."],["to get up","se lever","He gets up late."],["to have breakfast","prendre le petit déjeuner","We have breakfast together."],["to go to work","aller au travail","She goes to work by train."],["to start","commencer","School starts at nine."],["to finish","finir","I finish at five."],["lunch","déjeuner","Lunch is at noon."],["dinner","dîner","Dinner is ready."],["to go home","rentrer","I go home at six."],["to go to bed","se coucher","They go to bed early."],["to sleep","dormir","I sleep eight hours."],["to watch TV","regarder la télé","We watch TV at night."],["every day","tous les jours","I walk every day."],["weekend","week-end","What do you do at the weekend?"],["early","tôt","I get up early."],["late","tard","He comes home late."],["always","toujours","She is always happy."],["often","souvent","We often eat out."],["sometimes","parfois","Sometimes I cook."],["never","jamais","He never smokes."]],"sents":[["I get up at seven and I have breakfast at half past seven.","Je me lève à sept heures et je prends mon petit déjeuner à sept heures et demie."],["She works in a hospital and starts at eight.","Elle travaille dans un hôpital et commence à huit heures."],["My father always watches the news at night.","Mon père regarde toujours les informations le soir."],["We go to the cinema on Saturday.","Nous allons au cinéma le samedi."],["He never gets up before nine.","Il ne se lève jamais avant neuf heures."],["They finish work at quarter to six.","Ils finissent le travail à six heures moins le quart."]],"lv":"A1","can":"Je sais décrire ma journée et mes habitudes."},{"t":"Questions, négations et fréquence","rules":[{"h":"Négation et questions avec do / does","x":"**Négation** : **do not (don't)** / **does not (doesn't)** + base : *I don't like tea. She doesn't work here.* (le s disparaît !).\n**Question** : **Do / Does + sujet + base ?** *Do you speak English? Does he live here?* Réponses courtes : **Yes, I do. / No, she doesn't.**\nQuestions avec mot interrogatif : **What / Where / When / Why / Who / How + do/does + sujet + base** : *Where do you live? What time does he start?*\nAttention : avec **be**, pas de do : *Is she tired?*","ex":[["She doesn't work on Sundays.","Elle ne travaille pas le dimanche."],["Do you live near here?","Habites-tu près d'ici ?"],["What time does the shop open?","À quelle heure le magasin ouvre-t-il ?"]],"q":[["He ___ like coffee.",["doesn't","don't","isn't","not"],"he + doesn't + base."],["___ she speak French?",["Does","Do","Is","Has"],"Question à la 3e personne : Does."],["Where ___ you work?",["do","does","are","have"],"Where + do + you."]]},{"h":"Adverbes de fréquence","x":"Ordre : **always (100 %) > usually > often > sometimes > rarely / hardly ever > never (0 %)**.\nPlace : **avant le verbe principal** (*I often eat out*) mais **après be** (*She is always late*). *Sometimes, usually* peuvent aussi être en début de phrase.\nExpressions : **once a week, twice a month, three times a year, every day**. Question : **How often do you…? — Twice a week.**\nJamais de double négation : *I never go* (pas « I don't never go »).","ex":[["I usually take the bus.","Je prends généralement le bus."],["He is never late.","Il n'est jamais en retard."],["How often do you go to the gym? — Twice a week.","À quelle fréquence vas-tu à la salle ? — Deux fois par semaine."]],"q":[["She ___ eats meat. (0 %)",["never","always","usually","often"],"never = jamais."],["They are ___ late. (place correcte)",["always","are always","do always","always do"],"Après be : They are always late."],["How ___ do you call your mother?",["often","many","much","long"],"How often = à quelle fréquence."]]}],"words":[["to work","travailler","I work in an office."],["to live","habiter, vivre","They live in Leeds."],["to like","aimer","I like music."],["to love","adorer","She loves pizza."],["to speak","parler","Do you speak Spanish?"],["to eat","manger","We eat at seven."],["to drink","boire","He drinks tea."],["to read","lire","I read every night."],["to play","jouer","They play football."],["to cook","cuisiner","My dad cooks well."],["to open","ouvrir","The bank opens at nine."],["to close","fermer","The shop closes at six."],["to want","vouloir","I want a coffee."],["to need","avoir besoin de","We need help."],["to know","savoir, connaître","I know him."],["rarely","rarement","I rarely watch TV."],["usually","généralement","I usually walk."],["once a week","une fois par semaine","I swim once a week."],["twice","deux fois","Twice a day."],["how often","à quelle fréquence","How often do you travel?"]],"sents":[["I don't drink coffee in the evening.","Je ne bois pas de café le soir."],["Does your sister work in London?","Ta sœur travaille-t-elle à Londres ?"],["What time do you usually have lunch?","À quelle heure déjeunes-tu d'habitude ?"],["He doesn't know the answer.","Il ne connaît pas la réponse."],["We rarely eat out during the week.","Nous mangeons rarement au restaurant en semaine."],["How often do you visit your grandparents?","À quelle fréquence rends-tu visite à tes grands-parents ?"]],"lv":"A1","can":"Je sais poser des questions simples et dire à quelle fréquence."},{"t":"There is / there are, lieux et prépositions","rules":[{"h":"There is / there are","x":"**There is** + singulier ou indénombrable : *There is a park. There is some milk.* **There are** + pluriel : *There are two banks.*\nNégation : **there isn't / there aren't (any)**. Question : **Is there a…? Are there any…?** Réponses : **Yes, there is. / No, there aren't.**\nNe pas confondre avec **it is** (c'est) : *It is a park* identifie ; *There is a park* signale l'existence.\n**How many … are there?** : *How many rooms are there?*","ex":[["There is a supermarket near my house.","Il y a un supermarché près de chez moi."],["There aren't any shops here.","Il n'y a pas de magasins ici."],["Is there a bank in this street?","Y a-t-il une banque dans cette rue ?"]],"q":[["___ two chairs in the room.",["There are","There is","It is","They are"],"Pluriel : there are."],["Is there ___ milk in the fridge?",["any","a","an","many"],"Question avec indénombrable : any."],["___ a big park in my town.",["There is","There are","They are","It are"],"Singulier : there is."]]},{"h":"Prépositions de lieu","x":"**in** (dans, à l'intérieur d'un espace / une ville), **on** (sur, en contact), **at** (à un point précis : at the bus stop, at school), **under** (sous), **behind** (derrière), **in front of** (devant), **next to / beside** (à côté de), **between** (entre), **opposite** (en face de), **near** (près de), **above / below**.\nVille : **on the left / on the right / straight ahead / at the corner / turn left / go along**.\nExpressions fixes : **at home, at work, at school, in bed, on the first floor, in the street (UK), on the street (US)**.","ex":[["The cat is under the table.","Le chat est sous la table."],["The bank is opposite the station.","La banque est en face de la gare."],["Turn left at the corner and go straight ahead.","Tournez à gauche au coin et allez tout droit."]],"q":[["The keys are ___ the table. (sur)",["on","in","at","under to"],"on = sur."],["She is ___ home. (à la maison)",["at","in the","on","to"],"at home."],["The post office is ___ the bank and the school. (entre)",["between","among","behind to","near of"],"between = entre (deux choses)."]]}],"words":[["room","pièce, chambre","The room is big."],["kitchen","cuisine","The kitchen is clean."],["bedroom","chambre à coucher","My bedroom is small."],["bathroom","salle de bains","The bathroom is upstairs."],["garden","jardin","We have a garden."],["street","rue","This street is quiet."],["shop","magasin","The shop is open."],["bank","banque","The bank is near."],["park","parc","The park is nice."],["station","gare","Where is the station?"],["hospital","hôpital","The hospital is far."],["supermarket","supermarché","I go to the supermarket."],["restaurant","restaurant","A good restaurant."],["next to","à côté de","Next to the bank."],["opposite","en face de","Opposite the school."],["between","entre","Between two shops."],["behind","derrière","Behind the house."],["in front of","devant","In front of the door."],["left","gauche","Turn left."],["right","droite","On the right."]],"sents":[["There is a small garden behind the house.","Il y a un petit jardin derrière la maison."],["There aren't any restaurants in this street.","Il n'y a pas de restaurants dans cette rue."],["The supermarket is between the bank and the park.","Le supermarché est entre la banque et le parc."],["Is there a bus stop near here?","Y a-t-il un arrêt de bus près d'ici ?"],["Go straight ahead and turn right at the station.","Allez tout droit et tournez à droite à la gare."],["How many bedrooms are there in your flat?","Combien de chambres y a-t-il dans ton appartement ?"]],"lv":"A1","can":"Je sais décrire un lieu et dire où se trouve quelque chose."},{"t":"Can, could, goûts et loisirs","rules":[{"h":"Can / can't / could","x":"**can** : capacité ou permission au présent ; **can't / cannot** : incapacité ; **could** : capacité passée (I could swim at five) ou demande polie.\nAprès can : **base sans to**, jamais de s : *She can swim.* Question : **Can you help me?** Réponse : **Yes, I can. / No, I can't.**\nDemandes : **Can I have…? Could you open the window, please?** (plus poli).\nCapacité future ou autre temps : **be able to**.","ex":[["He can play the guitar but he can't sing.","Il sait jouer de la guitare mais il ne sait pas chanter."],["Could you help me, please?","Pourriez-vous m'aider, s'il vous plaît ?"],["I could read when I was four.","Je savais lire à quatre ans."]],"q":[["She ___ speak three languages.",["can","cans","can to","is can"],"can + base, sans s."],["___ you open the door, please? (poli)",["Could","Do","Are","Have"],"Could = demande polie."],["I ___ swim. I'm afraid of water.",["can't","don't","am not","haven't"],"can't = incapacité."]]},{"h":"Exprimer ses goûts : like, love, hate + -ing","x":"**like / love / enjoy / hate / don't mind + -ing** : *I like swimming. She hates getting up early.*\n**would like + to + base** (désir poli) : *I'd like to visit London.* Offre : **Would you like some tea?**\n**prefer** : *I prefer tea to coffee.* **be good at / bad at + -ing** : *He is good at cooking.* **be interested in + -ing**.\nLoisirs : play football / tennis / the guitar (instrument avec the), go swimming / running / shopping, listen to music, watch films, read books, travel, paint.","ex":[["I love listening to music.","J'adore écouter de la musique."],["Would you like to come with us?","Aimerais-tu venir avec nous ?"],["She is good at painting.","Elle est douée pour la peinture."]],"q":[["I enjoy ___ in the park.",["walking","walk","to walks","walked"],"enjoy + -ing."],["I ___ like a cup of tea, please. (poli)",["would","do","am","can"],"would like = désir poli."],["He plays ___ guitar.",["the","a","an","—"],"Instrument de musique : the."]]}],"words":[["to swim","nager","I can swim."],["to run","courir","She runs every morning."],["to dance","danser","They dance well."],["to sing","chanter","He sings in the shower."],["to draw","dessiner","I draw cartoons."],["to paint","peindre","She paints flowers."],["to travel","voyager","I love to travel."],["to listen","écouter","Listen to me."],["music","musique","I like pop music."],["film","film","A good film."],["sport","sport","What sport do you play?"],["football","football","They play football."],["guitar","guitare","He plays the guitar."],["hobby","passe-temps","My hobby is reading."],["free time","temps libre","In my free time, I swim."],["to prefer","préférer","I prefer tea."],["to hate","détester","I hate waiting."],["good at","bon en","Good at maths."],["bad at","mauvais en","Bad at singing."],["interested in","intéressé par","Interested in art."]],"sents":[["I can swim but I can't dive.","Je sais nager mais je ne sais pas plonger."],["Could you speak more slowly, please?","Pourriez-vous parler plus lentement, s'il vous plaît ?"],["She loves reading and she is good at drawing.","Elle adore lire et elle est douée pour le dessin."],["What do you do in your free time?","Que fais-tu pendant ton temps libre ?"],["I'd like to learn the guitar.","J'aimerais apprendre la guitare."],["My brother hates getting up early.","Mon frère déteste se lever tôt."]],"lv":"A1","can":"Je sais parler de mes capacités et de mes loisirs."},{"t":"Présent continu ou présent simple ?","rules":[{"h":"Le présent continu : am / is / are + -ing","x":"Il décrit une **action en cours** à l'instant, une situation **temporaire**, ou un **projet proche**.\n*I am working now. She is wearing a red dress. We are meeting Tom tomorrow.*\nForme : be + verbe en -ing. Orthographe : e muet supprimé (make → making), consonne doublée (run → running, sit → sitting), ie → ying (lie → lying).\nNégation : **isn't working**. Question : **Are you working?** Question ouverte : **What are you doing?**\nSignaux : now, at the moment, today, this week, look!, listen!","ex":[["Look! It is raining.","Regarde ! Il pleut."],["I'm not watching TV right now.","Je ne regarde pas la télé en ce moment."],["What are you doing? — I'm cooking dinner.","Que fais-tu ? — Je prépare le dîner."]],"q":[["Be quiet! The baby ___.",["is sleeping","sleeps","sleep","is sleep"],"Action en cours : présent continu."],["They ___ football at the moment.",["are playing","play","plays","is playing"],"at the moment → continu."],["She is ___ a book. (read)",["reading","read","reades","readding"],"read + ing."]]},{"h":"Simple ou continu ? Verbes d'état","x":"**Simple** : habitudes, faits (*I play tennis on Sundays*). **Continu** : maintenant, temporaire (*I'm playing tennis now*).\nLes **verbes d'état** n'ont pas de forme continue : **know, like, love, want, need, believe, understand, have (possession), belong, prefer, see, hear**. *I know the answer* (pas « I am knowing »). *I want a coffee.*\n**have** : *I have a car* (état) mais *I'm having lunch* (action).\nContraste : *He usually walks to work, but today he is taking the bus.*","ex":[["I understand the problem.","Je comprends le problème."],["He is having a shower.","Il prend une douche."],["She usually drinks tea, but today she is drinking coffee.","Elle boit généralement du thé, mais aujourd'hui elle boit du café."]],"q":[["I ___ what you mean.",["understand","am understanding","understanding","understands"],"Verbe d'état : pas de continu."],["We usually ___ at home, but today we are eating out.",["eat","are eating","eats","ate"],"usually → présent simple."],["He ___ a bath right now.",["is having","has","have","haves"],"have = action (prendre un bain) : continu possible."]]}],"words":[["now","maintenant","Call me now."],["at the moment","en ce moment","I'm busy at the moment."],["today","aujourd'hui","It's cold today."],["to wear","porter (vêtement)","He wears a hat."],["to rain","pleuvoir","It rains a lot."],["to snow","neiger","It's snowing."],["weather","temps (météo)","The weather is nice."],["sunny","ensoleillé","A sunny day."],["cloudy","nuageux","It's cloudy."],["cold","froid","It's cold."],["hot","chaud","A hot day."],["to wait","attendre","I'm waiting for you."],["to talk","parler, discuter","They are talking."],["to learn","apprendre","I'm learning English."],["to study","étudier","She studies law."],["to take a shower","prendre une douche","I take a shower."],["to cook","cuisiner","He's cooking dinner."],["to clean","nettoyer","I clean on Saturdays."],["busy","occupé","I'm very busy."],["tired","fatigué","I'm tired."]],"sents":[["Listen! Someone is playing the piano.","Écoute ! Quelqu'un joue du piano."],["I'm learning English because I'm moving to London.","J'apprends l'anglais parce que je déménage à Londres."],["He isn't working today; he's staying at home.","Il ne travaille pas aujourd'hui ; il reste à la maison."],["What are you reading? — A novel.","Que lis-tu ? — Un roman."],["It usually rains a lot here, but it isn't raining now.","Il pleut généralement beaucoup ici mais il ne pleut pas maintenant."],["I don't know the answer, but I'm thinking about it.","Je ne connais pas la réponse mais j'y réfléchis."]],"lv":"A1","can":"Je sais dire ce que je fais en ce moment ou d'habitude."},{"t":"Le passé simple : be, verbes réguliers et irréguliers","rules":[{"h":"Was / were et les verbes réguliers","x":"**be** : **I / he / she / it was, you / we / they were**. Négation : **wasn't / weren't**. Question : **Was he at home? Were you tired?**\n**Verbes réguliers** : base + **ed** (work → worked), **d** si e final (like → liked), consonne + y → **ied** (study → studied), consonne doublée (stop → stopped).\n**Négation et question** : **did + base** : *I didn't work. Did you work? — Yes, I did.* (le verbe revient à la base).\nPrononciation du -ed : /t/ (worked), /d/ (played), /ɪd/ (wanted, needed).\nSignaux : yesterday, last week / month / year, two days ago, in 2019, when I was a child.","ex":[["I was tired yesterday so I stayed at home.","J'étais fatigué hier, alors je suis resté à la maison."],["She didn't call me last night.","Elle ne m'a pas appelé hier soir."],["Did you watch the match? — Yes, I did.","As-tu regardé le match ? — Oui."]],"q":[["They ___ in Paris last year.",["were","was","are","been"],"they + were."],["I ___ TV last night. (not watch)",["didn't watch","don't watch","didn't watched","not watched"],"didn't + base."],["___ he call you yesterday?",["Did","Does","Was","Has"],"Question au passé : Did + base."]]},{"h":"Les verbes irréguliers les plus utiles","x":"Il faut les apprendre par cœur : **go → went, have → had, do → did, see → saw, come → came, get → got, make → made, take → took, eat → ate, drink → drank, buy → bought, give → gave, say → said, tell → told, write → wrote, read → read (prononcé /red/), meet → met, leave → left, speak → spoke, drive → drove, sit → sat, know → knew, think → thought, find → found, lose → lost, pay → paid, run → ran, sleep → slept**.\nAprès **did / didn't**, on revient à la base : *Did you go? I didn't go.*","ex":[["We went to Spain last summer.","Nous sommes allés en Espagne l'été dernier."],["She bought a new phone and gave me the old one.","Elle a acheté un nouveau téléphone et m'a donné l'ancien."],["I didn't see him but I heard his voice.","Je ne l'ai pas vu mais j'ai entendu sa voix."]],"q":[["Past of « go »:",["went","goed","gone","goes"],"go → went."],["He ___ me a letter yesterday. (write)",["wrote","writed","written","write"],"write → wrote."],["Did you ___ breakfast this morning?",["have","had","has","having"],"Après did : base."]]}],"words":[["yesterday","hier","I called yesterday."],["last night","hier soir","I slept well last night."],["last week","la semaine dernière","I saw him last week."],["ago","il y a","Two days ago."],["to visit","rendre visite à","We visited Rome."],["to stay","rester","I stayed home."],["to arrive","arriver","We arrived at six."],["to start","commencer","The film started late."],["to call","appeler","He called me."],["to buy","acheter","I bought a shirt."],["to sell","vendre","They sold their car."],["to meet","rencontrer","I met Anna."],["to leave","partir","He left at nine."],["to lose","perdre","I lost my keys."],["to find","trouver","I found a wallet."],["to send","envoyer","She sent an email."],["to pay","payer","I paid the bill."],["holiday","vacances","Our holiday was great."],["trip","voyage","A short trip."],["last year","l'année dernière","Last year I moved."]],"sents":[["Yesterday I got up late and missed the bus.","Hier je me suis levé tard et j'ai raté le bus."],["We visited Rome two years ago.","Nous avons visité Rome il y a deux ans."],["She didn't buy anything because she lost her wallet.","Elle n'a rien acheté parce qu'elle a perdu son portefeuille."],["Did you enjoy the film? — Yes, it was great.","Tu as aimé le film ? — Oui, il était génial."],["He left at nine and arrived at ten.","Il est parti à neuf heures et est arrivé à dix heures."],["I met my wife in 2015.","J'ai rencontré ma femme en 2015."]],"lv":"A2","can":"Je sais raconter ce que j'ai fait hier ou le week-end."},{"t":"Nourriture, quantités et achats","rules":[{"h":"Dénombrable ou indénombrable : some, any, much, many","x":"**Dénombrable** (on peut compter) : an apple, two apples. **Indénombrable** : water, rice, bread, milk, money, information, advice, traffic, weather, news.\n**some** : affirmatif (*I have some milk*) ; **any** : négatif et question (*I don't have any milk. Do you have any?*) ; mais *Would you like some tea?* (offre).\n**much** (indénombrable) / **many** (dénombrable) : surtout en négatif et question : *How much milk? How many eggs?* ; en affirmatif on dit **a lot of**.\n**a few / a little** : quelques / un peu.","ex":[["I need some bread and a few eggs.","J'ai besoin de pain et de quelques œufs."],["There isn't any sugar.","Il n'y a pas de sucre."],["How much does it cost? How many do you want?","Combien ça coûte ? Combien en voulez-vous ?"]],"q":[["How ___ water do you drink a day?",["much","many","few","a few"],"water est indénombrable : much."],["There aren't ___ chairs.",["any","some","a","much"],"Négation : any."],["I'd like ___ tea, please. (offre)",["some","any","many","a"],"Offre : some."]]},{"h":"Faire ses courses et commander","x":"**I'd like…, Can I have…, Could I have…?** **How much is it? / How much are they?** **That's 5 pounds.** **Anything else? — No, that's all, thank you.**\nRestaurant : **a table for two, the menu, starter / main course / dessert, the bill (UK) / the check (US), a tip**. **Still or sparkling water?**\nMagasin : **a kilo of, a bottle of, a packet of, a carton of, a slice of, a piece of, a can of**.\nMonnaie : **cash, card, change, receipt, price, cheap, expensive**.","ex":[["Can I have a coffee and a piece of cake, please?","Puis-je avoir un café et un morceau de gâteau, s'il vous plaît ?"],["How much are these apples?","Combien coûtent ces pommes ?"],["Could we have the bill, please?","Pourrions-nous avoir l'addition, s'il vous plaît ?"]],"q":[["I'd like a ___ of milk. (1 litre)",["carton","slice","pair","piece of"],"carton = brique."],["The American word for « the bill » is:",["the check","the change","the tip","the price"],"US : the check."],["A polite way to order:",["Could I have a tea, please?","Give me tea.","I want tea now.","Tea you have?"],"Could I have… ?"]]}],"words":[["bread","pain","Fresh bread."],["milk","lait","A glass of milk."],["water","eau","Still water."],["rice","riz","Rice and chicken."],["meat","viande","I don't eat meat."],["chicken","poulet","Roast chicken."],["fish","poisson","Fish and chips."],["egg","œuf","Two eggs."],["cheese","fromage","Cheese sandwich."],["vegetables","légumes","Eat more vegetables."],["fruit","fruits","Fresh fruit."],["sugar","sucre","No sugar, please."],["coffee","café","A black coffee."],["tea","thé","A cup of tea."],["bill","addition, facture","The bill, please."],["cheap","bon marché","It's cheap."],["expensive","cher","Too expensive."],["price","prix","What's the price?"],["change","monnaie","Keep the change."],["a bottle of","une bouteille de","A bottle of water."]],"sents":[["I'd like a coffee and a slice of cake, please.","Je voudrais un café et une part de gâteau, s'il vous plaît."],["There isn't any milk, but there are some eggs.","Il n'y a pas de lait mais il y a des œufs."],["How much is a kilo of apples?","Combien coûte un kilo de pommes ?"],["We need a lot of vegetables for the soup.","Nous avons besoin de beaucoup de légumes pour la soupe."],["Could we have the bill, please?","Pourrions-nous avoir l'addition, s'il vous plaît ?"],["This restaurant is cheap but the food is excellent.","Ce restaurant est bon marché mais la cuisine est excellente."]],"lv":"A2","can":"Je sais commander, acheter et parler de quantités."},{"t":"Comparatifs, superlatifs et descriptions","rules":[{"h":"Comparatif et superlatif","x":"**Adjectif court** (1 syllabe) : **-er / the -est** : tall → taller → the tallest ; big → bigger → the biggest ; y → ier / the -iest (happy → happier → the happiest).\n**Adjectif long** (2+ syllabes) : **more … / the most …** : more expensive, the most beautiful.\n**Irréguliers** : good → better → the best ; bad → worse → the worst ; far → further.\n**Comparer** : **than** (*taller than me*) ; égalité **as … as** (*as tall as*) ; **not as … as** (moins que).\nSuperlatif : **the** + … + **in / of** : *the biggest in the world, the best of all*.","ex":[["My brother is taller than me.","Mon frère est plus grand que moi."],["This is the most interesting book I've read.","C'est le livre le plus intéressant que j'aie lu."],["She is as tall as her mother.","Elle est aussi grande que sa mère."]],"q":[["London is ___ than Paris.",["bigger","more big","biggest","big"],"Adjectif court : -er."],["It's the ___ film of the year.",["best","better","most good","goodest"],"good → the best."],["This car is ___ expensive than that one.",["more","most","much","-er"],"Adjectif long : more … than."]]},{"h":"Décrire des personnes et des choses","x":"**Ordre des adjectifs** : opinion → taille → âge → forme → couleur → origine → matière + nom : *a beautiful old wooden table*.\nL'adjectif ne s'accorde pas : *a tall man, tall women*.\n**Description physique** : tall, short, slim, fat, young, old, bald, fair / dark hair, blue eyes. **He is tall** ; **He has got brown hair** ; **He looks tired** (apparence) ; **She looks like her mother** (ressemblance).\n**Caractère** : kind, funny, shy, friendly, lazy, hard-working, clever, serious, generous.","ex":[["She has long dark hair and green eyes.","Elle a de longs cheveux bruns et des yeux verts."],["He looks tired today.","Il a l'air fatigué aujourd'hui."],["She looks like her mother.","Elle ressemble à sa mère."]],"q":[["A ___ car. (ordre correct)",["big red","red big","reds big","bigs red"],"Taille avant couleur."],["He ___ like his father.",["looks","looks a","is looks","looking"],"look like = ressembler à."],["The adjective « tall » in « tall women »:",["does not change","becomes talls","becomes tallers","becomes talles"],"L'adjectif est invariable."]]}],"words":[["tall","grand (taille)","A tall man."],["short","petit, court","A short story."],["slim","mince","She is slim."],["young","jeune","A young girl."],["beautiful","beau","A beautiful city."],["ugly","laid","An ugly building."],["kind","gentil","He is kind."],["funny","drôle","A funny joke."],["shy","timide","She is shy."],["clever","intelligent","A clever boy."],["lazy","paresseux","Don't be lazy."],["friendly","sympathique","A friendly person."],["easy","facile","The test is easy."],["difficult","difficile","A difficult exercise."],["good","bon","A good idea."],["bad","mauvais","A bad day."],["better","meilleur","Better than before."],["worse","pire","It's getting worse."],["cheap","bon marché","A cheap hotel."],["far","loin","It's far from here."]],"sents":[["My sister is taller than me but I'm older than her.","Ma sœur est plus grande que moi mais je suis plus âgé qu'elle."],["This is the best restaurant in town.","C'est le meilleur restaurant de la ville."],["English is easier than I thought.","L'anglais est plus facile que je ne le pensais."],["He is as clever as his brother but less friendly.","Il est aussi intelligent que son frère mais moins sympathique."],["She has long black hair and brown eyes.","Elle a de longs cheveux noirs et des yeux marron."],["Today is the hottest day of the year.","Aujourd'hui est le jour le plus chaud de l'année."]],"lv":"A2","can":"Je sais comparer et décrire des choses et des gens."},{"t":"Projets et futur : going to, will, présent continu","rules":[{"h":"Going to et will","x":"**going to + base** : intention décidée ou prédiction avec preuve : *I'm going to study medicine. Look at those clouds: it's going to rain.*\n**will + base** : décision spontanée, promesse, offre, prédiction d'opinion : *I'll help you. I think it will be sunny.* Forme contractée : **'ll**, négation **won't**.\n**Présent continu** pour un rendez-vous fixé : *I'm meeting Anna at six.*\nSignaux : tomorrow, next week, next year, in two days, tonight, soon.","ex":[["I'm going to visit my cousin next month.","Je vais rendre visite à mon cousin le mois prochain."],["I'll carry your bag.","Je vais porter ton sac."],["I think it will rain tomorrow.","Je pense qu'il pleuvra demain."]],"q":[["The phone is ringing. — I ___ answer it.",["'ll","'m going to","am","do"],"Décision spontanée : will."],["We ___ a party on Saturday. (plan décidé)",["are going to have","will to have","have going","are will have"],"Intention décidée : going to."],["She ___ be late. (negative prediction)",["won't","doesn't","isn't","don't"],"won't = will not."]]},{"h":"Faire des projets, des invitations et des rendez-vous","x":"**What are you doing this weekend? — I'm going to the cinema.** **Are you free on Friday? — Sorry, I'm busy. / Yes, I'm free.**\nInviter : **Would you like to…? Do you want to…? How about…? Why don't we…? Let's…**\nAccepter : **Sure! / That sounds great. / I'd love to.** Refuser poliment : **I'm afraid I can't. / Sorry, I'm busy.**\nDates : **on Monday, on the 5th of May, in June, in 2027, next Monday, this evening**. Ordinaux : first, second, third, fourth… twentieth.","ex":[["Would you like to have dinner with us on Friday?","Aimerais-tu dîner avec nous vendredi ?"],["I'd love to, but I'm busy that day.","J'adorerais mais je suis occupé ce jour-là."],["Let's meet at seven in front of the cinema.","Retrouvons-nous à dix-neuf heures devant le cinéma."]],"q":[["A friendly invitation:",["How about going for a walk?","You go walk.","Walk now.","I want you walk."],"How about + -ing."],["To politely refuse:",["I'm afraid I can't.","No way.","I never.","You don't."],"Refus poli."],["« Le 3 mai » in English:",["on the 3rd of May","in the 3 May","at 3th May","on May the third day"],"on the 3rd of May."]]}],"words":[["tomorrow","demain","See you tomorrow."],["tonight","ce soir","I'm busy tonight."],["next week","la semaine prochaine","Next week I'm free."],["soon","bientôt","See you soon."],["plan","projet, plan","I have a plan."],["to plan","planifier","We plan a trip."],["to hope","espérer","I hope so."],["to decide","décider","I decided to go."],["to invite","inviter","I invited Tom."],["party","fête","A birthday party."],["appointment","rendez-vous (pro)","A doctor's appointment."],["meeting","réunion","A short meeting."],["free","libre","Are you free?"],["busy","occupé","I'm busy today."],["maybe","peut-être","Maybe tomorrow."],["probably","probablement","He will probably come."],["birthday","anniversaire","Happy birthday!"],["holiday","vacances, jour férié","Holiday plans."],["to book","réserver","I booked a table."],["ticket","billet","Two tickets, please."]],"sents":[["I'm going to start a new job next month.","Je vais commencer un nouveau travail le mois prochain."],["It will probably rain this weekend.","Il va probablement pleuvoir ce week-end."],["Are you doing anything on Friday evening?","Fais-tu quelque chose vendredi soir ?"],["I'll call you as soon as I arrive.","Je t'appelle dès que j'arrive."],["We aren't going to travel this summer.","Nous n'allons pas voyager cet été."],["Why don't we have dinner together tomorrow?","Pourquoi ne dînerions-nous pas ensemble demain ?"]],"lv":"A2","can":"Je sais parler de mes projets et faire des prévisions."},{"t":"Le present perfect : les bases","rules":[{"h":"Have / has + participe passé","x":"Le **present perfect** relie le passé au présent : expérience de vie, résultat présent, situation qui continue.\n**have / has + participe passé** : *I have seen it. She has finished.* Participe : régulier = -ed (worked) ; irréguliers : be → been, go → gone / been, see → seen, do → done, eat → eaten, write → written, take → taken, give → given, know → known, buy → bought, have → had.\nNégation : **haven't / hasn't**. Question : **Have you ever been to London? — Yes, I have.**\n**Mots clés** : **ever, never, already, yet, just, so far, recently**.","ex":[["I've never been to Japan.","Je ne suis jamais allé au Japon."],["She has just left.","Elle vient de partir."],["Have you finished yet? — Not yet.","As-tu fini ? — Pas encore."]],"q":[["I ___ never ___ sushi.",["have / eaten","has / eat","have / ate","did / eaten"],"have + participe passé (eaten)."],["She ___ already ___ the report.",["has / finished","have / finished","is / finishing","did / finished"],"3e personne : has."],["Have you ___ to Spain?",["been","be","was","being"],"Have you been to… ?"]]},{"h":"For, since et la différence avec le passé simple","x":"**for** + durée (for three years, for two hours) ; **since** + point de départ (since 2020, since Monday).\n*I have lived here for ten years / since 2016.* La situation continue.\n**Passé simple** : moment passé précis, terminé : *I lived there in 2010.* **Present perfect** : lien avec le présent, moment non précisé : *I have lived in Rome.*\nOn ne dit pas « I have seen him yesterday » : **I saw him yesterday**.\n**have gone** = parti (et pas revenu) / **have been** = allé et revenu.","ex":[["I have worked here for five years.","Je travaille ici depuis cinq ans."],["She has lived in Paris since 2019.","Elle vit à Paris depuis 2019."],["I saw him yesterday.","Je l'ai vu hier."]],"q":[["I've known her ___ ten years.",["for","since","from","during"],"for + durée."],["He has worked here ___ 2018.",["since","for","ago","from"],"since + date."],["I ___ that film last week.",["saw","have seen","have saw","see"],"last week : passé simple."]]}],"words":[["ever","déjà (dans une question)","Have you ever flown?"],["never","jamais","I've never tried it."],["already","déjà","I've already eaten."],["yet","pas encore / déjà ?","Not yet."],["just","à l'instant","I've just arrived."],["so far","jusqu'ici","So far it's good."],["recently","récemment","I've recently moved."],["for","pendant, depuis (durée)","For a week."],["since","depuis (point de départ)","Since 2020."],["experience","expérience","I have experience."],["to try","essayer","Have you tried it?"],["to finish","terminer","I've finished."],["to forget","oublier","I've forgotten his name."],["to lose","perdre","I've lost my keys."],["to break","casser","I've broken my phone."],["to travel","voyager","I've travelled a lot."],["abroad","à l'étranger","I've lived abroad."],["lately","dernièrement","I've been tired lately."],["once","une fois","I've been once."],["twice","deux fois","I've seen it twice."]],"sents":[["I have never been to Australia.","Je ne suis jamais allé en Australie."],["She has lived in London for six years.","Elle vit à Londres depuis six ans."],["Have you ever eaten Indian food?","As-tu déjà mangé indien ?"],["We haven't finished the project yet.","Nous n'avons pas encore fini le projet."],["He has just called me.","Il vient de m'appeler."],["I saw this film last year, but my wife hasn't seen it.","J'ai vu ce film l'an dernier, mais ma femme ne l'a pas vu."]],"lv":"A2","can":"Je sais parler de mes expériences."},{"t":"Devoir, conseils, conditionnel simple et relatives","rules":[{"h":"Must, have to, should, may","x":"**must** : obligation forte personnelle ; **have to** : obligation extérieure (règle, loi) : *I have to wear a uniform.* **mustn't** = interdit ; **don't have to** = pas obligé (différent !).\n**should / shouldn't** : conseil : *You should see a doctor.* **may / might** : possibilité : *It may rain.* **may I… ?** demande formelle.\nPassé de have to : **had to**. Question : **Do I have to…?**","ex":[["You must stop at a red light.","Il faut s'arrêter au feu rouge."],["You don't have to come. It's optional.","Tu n'es pas obligé de venir. C'est facultatif."],["You should drink more water.","Tu devrais boire plus d'eau."]],"q":[["You ___ smoke here. It's forbidden.",["mustn't","don't have to","needn't","haven't"],"mustn't = interdiction."],["You ___ pay. It's free.",["don't have to","mustn't","shouldn't to","can't must"],"don't have to = pas obligé."],["It's cold. You ___ wear a coat. (advice)",["should","may to","are","would"],"should = conseil."]]},{"h":"Si + présent / passé, et les relatives simples","x":"**Type 1 (réel)** : **If + présent, will + base** : *If it rains, we will stay home.* **Type 2 (irréel du présent)** : **If + past simple, would + base** : *If I had a car, I would drive to work.* (If I were you…).\n**Relatives** : **who** (personnes), **which** (choses), **that** (les deux, sans virgule), **where** (lieu), **whose** (appartenance) : *The man who lives next door is a doctor. The book that I bought is great.*\nPas de pronom personnel en plus : *The film that I saw* (pas « that I saw it »).","ex":[["If you study hard, you will pass the exam.","Si tu travailles dur, tu réussiras l'examen."],["If I won the lottery, I would buy a house.","Si je gagnais au loto, j'achèterais une maison."],["The woman who called is my aunt.","La femme qui a appelé est ma tante."]],"q":[["If it ___ tomorrow, we'll cancel the picnic.",["rains","will rain","rained","raining"],"Type 1 : if + présent."],["If I ___ rich, I would travel the world.",["were","am","will be","would be"],"Type 2 : if + were."],["The shop ___ I bought this is closed.",["where","who","which where","whose"],"where = lieu."]]}],"words":[["rule","règle","Follow the rules."],["law","loi","It's against the law."],["advice","conseil","Good advice."],["to allow","permettre","Pets are not allowed."],["forbidden","interdit","Smoking is forbidden."],["necessary","nécessaire","It's necessary."],["possible","possible","It's possible."],["impossible","impossible","It's impossible."],["if","si","If you want."],["unless","à moins que","Unless it rains."],["when","quand","When I arrive."],["who","qui","The man who called."],["which","lequel, qui (chose)","The car which I like."],["where","où","The town where I live."],["whose","dont, de qui","The man whose car."],["to win","gagner","I won a prize."],["lottery","loterie","I won the lottery."],["to pass","réussir (un examen)","I passed the exam."],["to fail","échouer","He failed the test."]],"sents":[["You must wear a seat belt in the car.","Il faut porter la ceinture dans la voiture."],["You don't have to wait; you can go in.","Tu n'as pas besoin d'attendre ; tu peux entrer."],["If I had more time, I would learn Spanish.","Si j'avais plus de temps, j'apprendrais l'espagnol."],["The man who lives upstairs is a pilot.","L'homme qui habite à l'étage est pilote."],["If you don't hurry, you will miss the train.","Si tu ne te dépêches pas, tu rateras le train."],["You should talk to someone who can help.","Tu devrais parler à quelqu'un qui peut t'aider."]],"lv":"A2","can":"Je sais donner un conseil et une obligation simple."},{"t":"Present perfect, past simple et aspect","rules":[{"h":"Present perfect ou past simple ?","x":"**Past simple** : action terminée à un moment passé précis ou une période terminée (yesterday, in 2019, last week, when I was young).\n**Present perfect** : lien avec le présent : expérience de vie, résultat actuel, période non terminée (this week, so far, ever, never, already, yet).\nAttention : le français emploie le passé composé pour les deux. En anglais, on ne dit pas « I have seen him yesterday » : on dit **I saw him yesterday**.","ex":[["I have worked here since 2021.","Je travaille ici depuis 2021."],["She worked here in 2015.","Elle a travaillé ici en 2015."],["Have you ever been to Canada?","Es-tu déjà allé au Canada ?"]],"q":[["She ___ the report an hour ago.",["sent","has sent","had sent","has been sending"],"« an hour ago » fixe un moment passé terminé : past simple."],["I ___ three emails this morning so far.",["have written","wrote","was writing","had written"],"« this morning so far » : période non terminée, donc present perfect."],["We ___ in Lyon for ten years now.",["have lived","lived","were living","live"],"Situation commencée dans le passé et qui continue : present perfect (for + durée)."]]},{"h":"Present perfect simple ou continu ?","x":"**Continu (have been -ing)** : insiste sur la durée ou l'activité en cours / qui vient de s'arrêter, avec des traces visibles.\n**Simple** : insiste sur le résultat, la quantité ou l'achèvement.\nCertains verbes d'état (know, belong, own) n'ont pas de forme continue.","ex":[["I've been fixing the unit all day.","Je répare l'unité depuis ce matin."],["I've fixed three units today.","J'ai réparé trois unités aujourd'hui."],["You look tired. Have you been working late?","Tu as l'air fatigué. Tu as travaillé tard ?"]],"q":[["How many pages ___ so far?",["have you read","have you been reading","did you be reading","are you read"],"« How many » demande une quantité (résultat) : present perfect simple."],["The floor is wet. It ___ all night.",["has been raining","has rained","rained","is raining"],"Trace visible d'une activité qui vient de s'arrêter : present perfect continu."],["I ___ him for years.",["have known","have been knowing","know","knew"],"« know » est un verbe d'état : pas de forme continue."]]}],"words":[["deadline","échéance, date limite","We must meet the deadline on Friday."],["to postpone","reporter","They postponed the meeting until Monday."],["to run late","être en retard","I'm running late, start without me."],["workload","charge de travail","My workload has doubled this year."],["to catch up","rattraper son retard","I need to catch up on my emails."],["to overlook","négliger, ne pas voir","We overlooked a small detail."],["outcome","résultat, issue","The outcome was better than expected."],["to achieve","atteindre, réaliser","She achieved all her targets."],["lately","dernièrement","I've been very busy lately."],["recently","récemment","We recently changed supplier."],["so far","jusqu'ici","So far, everything has gone well."],["meanwhile","pendant ce temps","Meanwhile, the team is testing the system."],["to keep up with","suivre le rythme de","It's hard to keep up with all the changes."],["to get used to","s'habituer à","I'm getting used to the new software."],["setback","contretemps, revers","We had a minor setback last week."],["to take place","avoir lieu","The training will take place in March."]],"sents":[["I have been waiting for the supplier since nine o'clock.","J'attends le fournisseur depuis neuf heures."],["We finished the first phase last month.","Nous avons terminé la première phase le mois dernier."],["She has never worked on a site this large.","Elle n'a jamais travaillé sur un chantier aussi grand."],["How long have you been living in France?","Depuis combien de temps vis-tu en France ?"],["They haven't replied to my email yet.","Ils n'ont pas encore répondu à mon e-mail."],["I lost my keys, so I can't open the door.","J'ai perdu mes clés, donc je ne peux pas ouvrir la porte."]],"lv":"B1","can":"Je choisis le bon temps pour parler du passé."},{"t":"Narrative tenses, used to et would","rules":[{"h":"Past simple, past continuous, past perfect","x":"**Past simple** : les événements qui font avancer le récit.\n**Past continuous** : le décor ou une action en cours quand autre chose arrive.\n**Past perfect (had + participe)** : une action antérieure à un autre moment du passé.\nEx. : When I arrived, the meeting had already started.","ex":[["By the time we got there, they had left.","Quand nous sommes arrivés, ils étaient partis."],["It was raining and the road was empty.","Il pleuvait et la route était vide."]],"q":[["When the engineer called, I ___ lunch.",["was having","had","have had","am having"],"Action en cours interrompue par une autre : past continuous."],["She was upset because she ___ her passport.",["had lost","lost","has lost","was losing"],"La perte est antérieure à son état d'énervement : past perfect."],["By the time the inspector arrived, we ___ everything.",["had checked","checked","were checking","have checked"],"« By the time » + action antérieure : past perfect."]]},{"h":"Habitudes passées : used to, would, past simple","x":"**used to + infinitif** : habitude ou état passé qui n'existe plus (états possibles : I used to live there).\n**would + infinitif** : habitude répétée seulement (pas pour les états : on ne dit pas « I would live there »).\nNégation / question : didn't use to, Did you use to… ?\n**be used to + -ing** = être habitué à (≠ used to).","ex":[["We used to work on paper drawings.","Nous travaillions avec des plans papier."],["Every summer, we would visit my grandparents.","Chaque été, nous allions chez mes grands-parents."],["I'm used to working under pressure.","J'ai l'habitude de travailler sous pression."]],"q":[["I ___ smoke, but I quit five years ago.",["used to","am used to","would to","use to"],"Habitude passée révolue : used to + infinitif."],["She isn't ___ to the cold climate yet.",["used","use","using","been used"],"« be used to » + nom ou -ing : être habitué."],["When I was a child, I ___ a bike. (état)",["had","would have","would had","was used to have"],"Pour un état ou une possession passée on ne peut pas utiliser « would » : past simple (ou used to have)."]]}],"words":[["to turn out","s'avérer","It turned out to be a faulty sensor."],["to figure out","comprendre, trouver","We finally figured out the problem."],["at first","au début","At first, nobody noticed the leak."],["in the end","à la fin, en fin de compte","In the end, we chose the cheaper option."],["suddenly","soudain","Suddenly, the lights went out."],["beforehand","au préalable","Please send me the files beforehand."],["afterwards","ensuite, après","Afterwards, we had a debrief."],["to notice","remarquer","Nobody noticed the error."],["to realise","se rendre compte","I realised I had forgotten my badge."],["to take over","reprendre, prendre le relais","She took over the project in May."],["to set up","installer, mettre en place","They set up a temporary office."],["to carry out","effectuer","We carried out all the tests."],["on the verge of","sur le point de","The plant was on the verge of shutting down."],["hardly ever","presque jamais","He hardly ever takes a day off."]],"sents":[["We used to have weekly meetings on Mondays.","Nous avions des réunions hebdomadaires le lundi."],["After he had finished, he sent a summary.","Après avoir terminé, il a envoyé un résumé."],["She was exhausted because she had been working all night.","Elle était épuisée parce qu'elle avait travaillé toute la nuit."],["It took us hours to get used to the new system.","Il nous a fallu des heures pour nous habituer au nouveau système."]],"lv":"B1","can":"Je sais raconter une histoire au passé avec nuance."},{"t":"Formes du futur","rules":[{"h":"Will, going to, présent continu","x":"**will** : décision spontanée, prédiction basée sur l'opinion, promesse.\n**going to** : intention déjà prise, ou prédiction basée sur une preuve visible.\n**Présent continu** : arrangement fixé (heure, lieu, personnes).\n**Présent simple** : horaires officiels (The train leaves at 8).","ex":[["I'll help you with that.","Je vais t'aider avec ça."],["Look at those clouds. It's going to rain.","Regarde ces nuages. Il va pleuvoir."],["I'm meeting the client at three.","Je rencontre le client à trois heures."]],"q":[["The phone is ringing. I ___ it.",["'ll get","'m going to get","'m getting","get"],"Décision prise sur le moment : will."],["We ___ the contractor on Thursday; it's in my diary.",["are meeting","will meet","meet","are going meet"],"Arrangement déjà fixé : présent continu."],["The conference ___ at 9 a.m. tomorrow.",["starts","is starting","will be start","is going start"],"Programme officiel : présent simple."]]},{"h":"Future continuous et future perfect","x":"**will be + -ing** : action en cours à un moment futur, ou arrangement poli (Will you be using the car?).\n**will have + participe** : action terminée avant un moment futur (By Friday, I will have finished).\n**will have been + -ing** : durée accumulée à un moment futur.\nAprès when / as soon as / before / until / once : présent, jamais will.","ex":[["This time next week, I'll be flying to Dubai.","À cette heure-ci la semaine prochaine, je serai en vol vers Dubaï."],["I'll call you as soon as I arrive.","Je t'appelle dès que j'arrive."]],"q":[["By the end of the year, he ___ here for a decade.",["will have been working","will work","is working","will be work"],"Durée accumulée à un moment futur : future perfect continuous."],["I'll text you when I ___ the site.",["reach","will reach","am reaching","will have reach"],"Après « when » on emploie le présent pour le futur."],["At 10 tomorrow, we ___ the final tests.",["will be running","will run","run","are run"],"Action en cours à un moment futur précis : future continuous."]]}],"words":[["forecast","prévision","The forecast says heavy rain."],["to schedule","planifier","We scheduled the test for Monday."],["upcoming","à venir","The upcoming audit worries everyone."],["on track","dans les temps","The project is on track."],["ahead of schedule","en avance sur le planning","We're ahead of schedule."],["behind schedule","en retard sur le planning","The works are behind schedule."],["to expect","s'attendre à","We expect delivery next week."],["to be about to","être sur le point de","I'm about to leave."],["sooner or later","tôt ou tard","Sooner or later, it will fail."],["in due course","en temps voulu","You will receive a reply in due course."],["shortly","sous peu","The manager will join us shortly."],["to anticipate","anticiper","We anticipate some delays."],["milestone","jalon","The first milestone is next month."],["prospects","perspectives","Career prospects are good."],["to look forward to","avoir hâte de","I look forward to hearing from you."],["provided that","à condition que","We'll start provided that you approve."]],"sents":[["We are going to renegotiate the contract next month.","Nous allons renégocier le contrat le mois prochain."],["By Friday, I will have sent all the reports.","D'ici vendredi, j'aurai envoyé tous les rapports."],["Don't worry, I'll call you as soon as I know.","Ne t'inquiète pas, je t'appelle dès que je sais."],["The inspection is scheduled for the 14th.","L'inspection est prévue le 14."],["I'm afraid the project won't be finished by then.","Je crains que le projet ne soit pas terminé d'ici là."]],"lv":"B1","can":"J'exprime le futur avec la forme juste."},{"t":"Modaux : déduction, obligation, reproche","rules":[{"h":"Déduction : must, can't, might, could","x":"Présent : **must** (quasi certain), **might / may / could** (possible), **can't** (impossible).\nPassé : **must have / might have / could have / can't have + participe passé**.\nOn n'utilise pas « mustn't » pour la déduction négative : on dit **can't**.","ex":[["He must be at the site; his car is outside.","Il doit être sur le chantier ; sa voiture est dehors."],["She can't have forgotten the meeting.","Elle ne peut pas avoir oublié la réunion."],["It might have been a sensor error.","Ce pouvait être une erreur de capteur."]],"q":[["The lights are on, so they ___ be in the office.",["must","can't","needn't","shouldn't"],"Quasi-certitude positive : must."],["That ___ be the problem; we already checked it twice.",["can't","mustn't","needn't","may not to"],"Impossibilité logique : can't."]]},{"h":"Obligation, interdiction, reproche","x":"**must / have to** : obligation. Négation : **mustn't** = interdit ; **don't have to / needn't** = pas nécessaire.\n**should / ought to** : conseil. **should have + participe** : reproche ou regret (You should have called me).\n**needn't have + participe** : c'était inutile, mais on l'a fait.\n**be allowed to / can** : permission.","ex":[["You mustn't enter without a helmet.","Il est interdit d'entrer sans casque."],["You don't have to wear a tie.","Tu n'es pas obligé de porter une cravate."],["We should have checked the drawings first.","Nous aurions dû vérifier les plans d'abord."]],"q":[["It's forbidden: you ___ smoke here.",["mustn't","don't have to","needn't","shouldn't have"],"Interdiction : mustn't."],["We ___ have hurried; the train was late too.",["needn't","mustn't","can't","shouldn't to"],"« needn't have » : c'était inutile."],["You ___ told me earlier. Now it's too late.",["should have","should","must","would"],"Reproche sur le passé : should have + participe."]]}],"words":[["to be supposed to","être censé","You're supposed to sign here."],["compulsory","obligatoire","Safety training is compulsory."],["optional","facultatif","Attendance is optional."],["to permit","autoriser","Smoking is not permitted."],["to forbid","interdire","Photos are forbidden on site."],["regulation","règlement","New regulations come into force."],["to comply with","se conformer à","All units must comply with the standard."],["liability","responsabilité (juridique)","The contractor accepts no liability."],["hazard","danger","Wet floors are a hazard."],["to be bound to","être tenu de, être voué à","You are bound to follow the procedure."],["guideline","directive, recommandation","Follow the safety guidelines."],["requirement","exigence","It meets all requirements."],["to oblige","obliger","The law obliges us to report it."],["necessarily","nécessairement","It's not necessarily a fault."],["presumably","vraisemblablement","Presumably, they're stuck in traffic."]],"sents":[["You must have been exhausted after the night shift.","Tu as dû être épuisé après l'équipe de nuit."],["They can't have received my message.","Ils ne peuvent pas avoir reçu mon message."],["We needn't have rushed; the client wasn't ready.","Nous n'aurions pas dû nous presser ; le client n'était pas prêt."],["You ought to double-check the figures.","Tu devrais revérifier les chiffres."],["Visitors aren't allowed to enter the plant room.","Les visiteurs n'ont pas le droit d'entrer dans le local technique."],["It could have been much worse.","Cela aurait pu être bien pire."]],"lv":"B1","can":"Je sais déduire, obliger et reprocher avec les modaux."},{"t":"Conditionnels et souhaits","rules":[{"h":"Types 0 à 3 et conditionnels mixtes","x":"**Type 0** : If + présent, présent (vérité générale).\n**Type 1** : If + présent, will (réel / probable).\n**Type 2** : If + past simple, would (irréel présent ; avec be : If I were).\n**Type 3** : If + past perfect, would have + participe (irréel passé).\n**Mixte** : If I had taken the job, I would be rich now.\n**Unless** = if … not. **Provided / as long as** = à condition que.","ex":[["If the pressure drops, the alarm sounds.","Si la pression chute, l'alarme retentit."],["If I were you, I'd call the supplier.","À ta place, j'appellerais le fournisseur."],["If we had tested it, we would have found the fault.","Si nous l'avions testé, nous aurions trouvé la panne."]],"q":[["If I ___ more time, I would help you.",["had","have","would have","will have"],"Type 2 : if + past simple."],["If they ___ earlier, they wouldn't have missed the flight.",["had left","left","would leave","have left"],"Type 3 : if + past perfect."],["___ you tell me the price, I can't decide.",["Unless","If","Provided","Whether"],"Unless = if … not."]]},{"h":"Inversion, wish et if only","x":"Inversion formelle : **Should you need help, call me** (= If you need) ; **Were I you…** ; **Had I known, I would have come.**\n**I wish / If only + past simple** : regret sur le présent. **+ past perfect** : regret sur le passé. **+ would** : agacement sur le comportement d'autrui (I wish you would stop).\n**It's time + past simple** : il est temps que.","ex":[["Had I known, I would have told you.","Si j'avais su, je te l'aurais dit."],["I wish I had more experience.","J'aimerais avoir plus d'expérience."],["It's time we started.","Il est temps de commencer."]],"q":[["___ you require further information, please contact us.",["Should","Would","Had","Did"],"Inversion formelle de « if you require »."],["I wish I ___ the contract before signing it.",["had read","read","would read","have read"],"Regret sur le passé : wish + past perfect."],["If only it ___ raining; we could start work.",["stopped","stops","would have stopped","stop"],"If only + past simple (regret/souhait présent)."]]}],"words":[["outcome","issue, résultat","The outcome depends on the weather."],["unless","à moins que","We won't go unless you agree."],["otherwise","sinon","Sign today, otherwise the offer expires."],["in case","au cas où","Take a jacket in case it rains."],["as long as","tant que","You may stay as long as you like."],["assuming that","en supposant que","Assuming that the budget is approved, we start."],["on condition that","à condition que","He agreed on condition that we paid upfront."],["regret","regret","I have no regrets."],["to hesitate","hésiter","Don't hesitate to ask."],["wisely","sagement","She acted wisely."],["alternative","alternative","We need a plan B or an alternative."],["fallback","solution de repli","Do we have a fallback plan?"],["to risk","risquer","We can't risk another failure."],["consequence","conséquence","Serious consequences followed."],["to avoid","éviter","Avoid touching the surface."],["had better","il vaudrait mieux","You had better check first."]],"sents":[["If we had known about the leak, we would have acted sooner.","Si nous avions su pour la fuite, nous aurions agi plus tôt."],["Should you have any questions, please let me know.","Si vous avez des questions, faites-le-moi savoir."],["If only I had taken the earlier train!","Si seulement j'avais pris le train d'avant !"],["Unless the supplier delivers on time, we will be late.","À moins que le fournisseur ne livre à temps, nous serons en retard."],["I wish you would listen to me.","J'aimerais que tu m'écoutes."],["If I were in charge, I'd change the schedule.","Si j'étais responsable, je changerais le planning."]],"lv":"B1","can":"Je sais faire des hypothèses et exprimer des regrets."},{"t":"Passif et causatif","rules":[{"h":"Le passif à tous les temps","x":"**be + participe passé**, au temps voulu : is checked, was checked, has been checked, will be checked, is being checked, must be checked.\nOn l'utilise quand l'agent est inconnu ou sans importance, ou pour un style formel/technique. L'agent : **by**.\nAvec deux compléments : *I was given a badge* (personne en sujet) ou *A badge was given to me*.\nPassif impersonnel : **It is said that… / He is said to be…**","ex":[["The system has been tested twice.","Le système a été testé deux fois."],["He is believed to be abroad.","On croit qu'il est à l'étranger."]],"q":[["The report ___ by the end of the week.",["will be finished","will finish","is finishing","finishes"],"Passif futur : will be + participe."],["Right now, the unit ___ for maintenance.",["is being inspected","is inspecting","inspects","has inspected"],"Passif présent continu."],["The building ___ in 1998.",["was built","has been built","is built","built"],"Passif past simple (date précise)."]]},{"h":"Le causatif : have / get something done","x":"**have + objet + participe passé** : faire faire quelque chose par quelqu'un (service). **I had my laptop repaired.**\n**get + objet + participe** : plus familier. **have someone do** (+ infinitif sans to), **get someone to do** (+ to).\nAussi pour un événement subi : *He had his car stolen.*","ex":[["We're having the roof repaired.","Nous faisons réparer le toit."],["She had her bag stolen.","Elle s'est fait voler son sac."]],"q":[["I need to ___ my passport renewed.",["have","make","do","let"],"Causatif : have + objet + participe."],["I'll ___ the technician call you back.",["have","get","make to","let to"],"have + personne + infinitif sans to."]]}],"words":[["to repair","réparer","They repaired the roof."],["to replace","remplacer","Replace the filter monthly."],["to inspect","inspecter","The engineer inspects the site."],["to approve","approuver","The plan was approved."],["to reject","rejeter","The offer was rejected."],["to deliver","livrer","The parts were delivered late."],["to invoice","facturer","We invoiced the client in May."],["to dismiss","licencier, écarter","He was dismissed for misconduct."],["to appoint","nommer","She was appointed manager."],["to complete","achever","The works were completed in June."],["to damage","endommager","The cable was damaged."],["to authorise","autoriser","Only authorised staff may enter."],["to enforce","faire appliquer","Rules are strictly enforced."],["to be held","se tenir (réunion)","The meeting will be held online."]],"sents":[["The new regulations have been introduced across Europe.","Les nouvelles réglementations ont été introduites dans toute l'Europe."],["It is expected that prices will rise.","On s'attend à ce que les prix augmentent."],["The drawings are being revised at the moment.","Les plans sont en cours de révision en ce moment."],["He was given a warning by his manager.","Il a reçu un avertissement de son responsable."],["Where can I get my watch repaired?","Où puis-je faire réparer ma montre ?"]],"lv":"B1","can":"Je sais décrire un processus et faire faire quelque chose."},{"t":"Discours rapporté et verbes de report","rules":[{"h":"Concordance des temps","x":"Quand le verbe introducteur est au passé, on « recule » d'un temps : présent → past simple ; past simple / present perfect → past perfect ; will → would ; can → could ; may → might. Les pronoms et les repères de temps changent : today → that day, tomorrow → the next day, ago → before, here → there.\nOn ne recule pas si le fait est toujours vrai ou si le verbe introducteur est au présent.\nQuestions rapportées : ordre affirmatif, pas de do. **She asked where I lived.** Oui/non : **if / whether**.","ex":[["He said he was leaving the next day.","Il a dit qu'il partait le lendemain."],["She asked me if I had finished.","Elle m'a demandé si j'avais fini."],["They told us the meeting would start late.","Ils nous ont dit que la réunion commencerait en retard."]],"q":[["« I will call you tomorrow », he said. → He said he ___ me the next day.",["would call","will call","called","has called"],"will → would, tomorrow → the next day."],["« Where do you work? » → She asked me where I ___.",["worked","do work","work","did work"],"Question rapportée : ordre affirmatif, reculer au past simple."],["« Have you seen the report? » → He asked ___ I had seen the report.",["if","that","what","which"],"Question fermée rapportée : if / whether."]]},{"h":"Verbes de report : suggest, admit, deny, warn…","x":"Choisis la bonne construction :\n**+ -ing** : admit, deny, suggest, recommend, regret (He denied taking the money).\n**+ to + infinitif** : agree, refuse, promise, offer, threaten (She refused to sign).\n**+ personne + to** : advise, warn, remind, invite, encourage, tell (He warned us not to touch it).\n**+ that** : explain, claim, announce, point out, insist.","ex":[["She suggested moving the meeting.","Elle a suggéré de déplacer la réunion."],["He warned us not to touch the wires.","Il nous a prévenus de ne pas toucher les fils."],["They promised to deliver on Friday.","Ils ont promis de livrer vendredi."]],"q":[["He admitted ___ the mistake.",["making","to make","that make","to making"],"admit + -ing."],["She reminded me ___ the door.",["to lock","locking","lock","that to lock"],"remind + personne + to."],["The manager insisted ___ the work was finished on time.",["that","to","on to","for"],"insist that + proposition."]]}],"words":[["to claim","prétendre","He claims the part was faulty."],["to point out","faire remarquer","She pointed out an error."],["to insist","insister","He insisted on paying."],["to admit","admettre","I admit I was wrong."],["to deny","nier","They denied any responsibility."],["to warn","avertir","He warned us about the risks."],["to remind","rappeler à qqn","Remind me to call him."],["to announce","annoncer","They announced a new policy."],["to explain","expliquer","Could you explain the procedure?"],["to suggest","suggérer","I suggest a short break."],["to complain","se plaindre","Customers complained about noise."],["to confirm","confirmer","Please c
