onfirm your attendance."],["to reply","répondre","She replied immediately."],["to mention","mentionner","He mentioned a delay."],["to propose","proposer","I propose a new timeline."],["to reveal","révéler","The audit revealed major gaps."]],"sents":[["She asked whether the report was ready.","Elle a demandé si le rapport était prêt."],["They denied having received the invoice.","Ils ont nié avoir reçu la facture."],["He suggested that we meet on site.","Il a suggéré que nous nous retrouvions sur place."],["I told him I would send the files that evening.","Je lui ai dit que j'enverrais les fichiers ce soir-là."]],"lv":"B2","can":"Je sais rapporter ce que quelqu'un a dit."},{"t":"Propositions relatives et participiales","rules":[{"h":"Relatives déterminatives et explicatives","x":"**who** (personnes), **which** (choses), **that** (personnes/choses, déterminatives seulement), **whose** (possession), **where / when / why**.\n**Déterminative** (sans virgule) : précise le nom. Le pronom complément peut être omis : *The report (that) I wrote.*\n**Explicative** (virgules) : information supplémentaire ; **that** impossible ; pronom obligatoire. *My manager, who lives in Paris, is away.*\n**which** peut reprendre toute une phrase : *He was late, which annoyed everyone.*","ex":[["The engineer who fixed it is on holiday.","L'ingénieur qui l'a réparé est en vacances."],["The site, which opened in 2020, is huge.","Le site, qui a ouvert en 2020, est immense."],["That's the man whose car was stolen.","C'est l'homme dont la voiture a été volée."]],"q":[["The company ___ I work for is expanding.",["that","who","whose","what"],"Complément d'une chose : that / which (ou omis)."],["My colleague, ___ speaks four languages, is leaving.",["who","that","which","whom he"],"Explicative sur une personne : who (that impossible)."],["The team, ___ results were excellent, got a bonus.",["whose","who's","which","that"],"Possession : whose."]]},{"h":"Propositions participiales","x":"**Participe présent** : action simultanée ou cause (*Walking to work, I saw an accident*). Sujet identique obligatoire.\n**Participe passé** : sens passif (*Built in 1990, the plant is old*).\n**Having + participe** : action antérieure (*Having finished, we left*).\nRéduction d'une relative : *The man standing there* = who is standing ; *a unit made in Italy* = which was made.\nAttention au sujet « flottant » : *Walking to work, the bus passed me* est incorrect.","ex":[["Having checked everything, we left the site.","Après avoir tout vérifié, nous avons quitté le site."],["Not knowing the code, I couldn't enter.","Ne connaissant pas le code, je n'ai pas pu entrer."]],"q":[["___ the report, she sent it to the director.",["Having finished","Finished","To finish having","Finishing to"],"Action antérieure : having + participe passé."],["The equipment ___ yesterday is already broken.",["delivered","delivering","which delivering","delivers"],"Participe passé (sens passif) réduit la relative."],["___ in Italy, the machine is of high quality.",["Made","Making","Having make","Make"],"Sens passif : participe passé."]]}],"words":[["whereas","alors que","Prices rose, whereas wages stayed flat."],["whom","lequel/laquelle (objet, formel)","The people with whom I work are friendly."],["whose","dont (possession)","The firm whose contract we lost is huge."],["both","les deux","Both teams agreed."],["neither","ni l'un ni l'autre","Neither option is ideal."],["either","l'un ou l'autre","Either date works."],["the former","le premier (des deux)","The former is cheaper."],["the latter","le second (des deux)","The latter is more reliable."],["respectively","respectivement","Prices are 5 and 7 euros respectively."],["namely","à savoir","One issue remains, namely cost."],["in particular","en particulier","I enjoyed the first part in particular."],["such as","tel que","Tools such as pliers are provided."],["including","y compris","All units, including spares, are tagged."],["apart from","à part","Apart from the noise, it works."],["whenever","chaque fois que","Call me whenever you need."],["wherever","où que","Wherever you go, bring ID."]],"sents":[["The technician who installed the sensors is called Paul.","Le technicien qui a installé les capteurs s'appelle Paul."],["Our supplier, whose prices are high, is reliable.","Notre fournisseur, dont les prix sont élevés, est fiable."],["Having read the manual, he started the machine.","Après avoir lu le manuel, il a démarré la machine."],["The report, which was sent yesterday, contains errors.","Le rapport, qui a été envoyé hier, contient des erreurs."],["Anyone wishing to attend should register.","Toute personne souhaitant participer doit s'inscrire."],["That's the room where we keep the spare parts.","C'est la pièce où nous gardons les pièces de rechange."]],"lv":"B2","can":"Je sais construire des phrases complexes et précises."},{"t":"Gérondif ou infinitif ?","rules":[{"h":"Verbes suivis de -ing ou de to","x":"**+ -ing** : enjoy, avoid, finish, keep, mind, consider, risk, suggest, admit, postpone, can't help, don't mind.\n**+ to** : decide, hope, plan, manage, afford, refuse, expect, learn, tend, seem, fail.\n**Après une préposition : toujours -ing** : interested in learning, look forward to meeting (to est une préposition).\n**Après un adjectif** : souvent to (ready to start) ou préposition + -ing (good at planning).","ex":[["She avoided answering the question.","Elle a évité de répondre à la question."],["We decided to postpone the launch.","Nous avons décidé de reporter le lancement."],["I look forward to meeting you.","J'ai hâte de vous rencontrer."]],"q":[["We can't afford ___ another delay.",["to have","having","have","to having"],"afford + to."],["He keeps ___ the same mistake.",["making","to make","make","to making"],"keep + -ing."],["I'm not used to ___ so early.",["getting up","get up","to get up","getting to up"],"be used to + -ing."]]},{"h":"Verbes qui changent de sens : remember, stop, try, forget, regret","x":"**remember / forget + to** : (ne pas) penser à faire. **+ -ing** : se souvenir d'avoir fait.\n**stop + -ing** : arrêter de ; **stop + to** : s'arrêter pour faire.\n**try + to** : s'efforcer ; **try + -ing** : essayer pour voir.\n**regret + -ing** : regretter d'avoir fait ; **regret to** (formel) : avoir le regret d'annoncer.\n**go on + -ing** : continuer ; **go on to** : passer à autre chose.","ex":[["Remember to lock the door.","N'oublie pas de verrouiller la porte."],["I remember locking the door.","Je me souviens d'avoir verrouillé la porte."],["Try restarting the system.","Essaie de redémarrer le système."]],"q":[["Don't forget ___ the lights off.",["to turn","turning","turn","to turning"],"Oublier de faire (devoir futur) : forget + to."],["He stopped ___ because he was tired.",["working","to work","work","for working"],"Arrêter une activité : stop + -ing."],["I regret ___ you that the position has been filled.",["to inform","informing","inform","for inform"],"Formule formelle : regret to + infinitif."]]}],"words":[["to manage to","réussir à","We managed to finish on time."],["to tend to","avoir tendance à","Prices tend to rise in winter."],["to fail to","ne pas réussir à / omettre de","They failed to comply."],["to consider","envisager","Consider changing supplier."],["to avoid","éviter","Avoid delays."],["to keep","continuer, garder","Keep going."],["to mind","être gêné par","Do you mind waiting?"],["to risk","risquer","Don't risk losing data."],["to put off","remettre à plus tard","Don't put off the decision."],["to give up","abandonner","Never give up."],["to carry on","continuer","Carry on working."],["to look forward to","attendre avec impatience","I look forward to it."],["in charge of","responsable de","She is in charge of quality."],["capable of","capable de","The unit is capable of 500 kW."],["fond of","apprécier","He's fond of cycling."]],"sents":[["I'd like to avoid wasting more time.","Je voudrais éviter de perdre plus de temps."],["She managed to repair it without help.","Elle a réussi à le réparer sans aide."],["Stop talking and listen, please.","Arrêtez de parler et écoutez, s'il vous plaît."],["We stopped to check the gauges.","Nous nous sommes arrêtés pour vérifier les manomètres."],["He's interested in working abroad.","Il est intéressé par l'idée de travailler à l'étranger."],["I'll never forget meeting the director.","Je n'oublierai jamais ma rencontre avec le directeur."]],"lv":"B2","can":"Je choisis entre -ing et to + verbe sans hésiter."},{"t":"Inversion, insistance et phrases clivées","rules":[{"h":"Inversion après un adverbe négatif","x":"Après certains adverbes négatifs ou restrictifs placés en tête, on inverse auxiliaire et sujet (registre soutenu) :\n**Never / Rarely / Seldom / Hardly … when / No sooner … than / Not only … but also / Only after / Only when / Under no circumstances / At no time / Little did I know**.\nSi pas d'auxiliaire, on ajoute do/does/did.\n*Never have I seen such a mess.* *No sooner had we left than it rained.*","ex":[["Rarely do we get such good results.","Nous obtenons rarement d'aussi bons résultats."],["Not only did he apologise, but he also paid for it.","Non seulement il s'est excusé, mais il a aussi payé."]],"q":[["Hardly ___ the building when the alarm rang.",["had we entered","we entered","did we enter","we had entered"],"« Hardly » en tête : inversion + past perfect, puis when."],["Not until Monday ___ the results.",["did we receive","we received","we did receive","received we"],"Inversion avec « Not until » en tête."],["Never ___ such a complex system.",["have I seen","I have seen","I saw","did I seen"],"Never en tête : inversion sujet/auxiliaire."]]}],"words":[["rarely","rarement","Rarely do we meet in person."],["seldom","rarement (soutenu)","Seldom has he been late."],["no sooner … than","à peine … que","No sooner had I sat than the phone rang."],["hardly … when","à peine … que","Hardly had we begun when it stopped."],["under no circumstances","en aucun cas","Under no circumstances should you leave."],["not until","pas avant que","Not until May did we see progress."],["little did I know","je ne me doutais pas","Little did I know it was a trap."],["by no means","nullement","It is by no means certain."],["on no account","en aucun cas","On no account must it be opened."],["the very","le tout","The very idea is absurd."],["indeed","en effet, vraiment","It is indeed a problem."],["surely","sûrement (appel à accord)","Surely you can see the issue?"],["at all","du tout","It doesn't work at all."],["whatsoever","absolument (aucun)","We had no problems whatsoever."],["far from","loin de","It's far from perfect."],["all the more","d'autant plus","That makes it all the more urgent."]],"sents":[["Never have I worked with such a motivated team.","Jamais je n'avais travaillé avec une équipe aussi motivée."],["No sooner had we installed it than it failed.","À peine l'avions-nous installé qu'il est tombé en panne."],["What really matters is safety.","Ce qui compte vraiment, c'est la sécurité."],["It was only after the inspection that we found the leak.","Ce n'est qu'après l'inspection que nous avons trouvé la fuite."],["Under no circumstances should the door be left open.","En aucun cas la porte ne doit rester ouverte."],["Little did they realise how serious it was.","Ils ne se rendaient pas compte de la gravité de la situation."]],"lv":"B2","can":"Je sais mettre une idée en relief."},{"t":"Quantité, articles et comparaisons","rules":[{"h":"Quantifieurs et articles","x":"**Dénombrable** : many, a few, few, fewer, several. **Indénombrable** : much, a little, little, less. Les deux : some, any, a lot of, plenty of, enough.\n**a few / a little** = quelques (positif) ; **few / little** = très peu (négatif).\nInformation, advice, equipment, furniture, news, luggage, work, progress, knowledge sont **indénombrables** : pas de « s », pas de « an » (*a piece of advice*).\n**Article** : the = déjà identifié ou unique ; pas d'article pour le général (*Safety is important*) ; **the** devant un adjectif = catégorie (*the elderly*).","ex":[["We have little time and few options.","Nous avons peu de temps et peu d'options."],["Can you give me some advice?","Peux-tu me donner un conseil ?"],["There isn't enough equipment on site.","Il n'y a pas assez de matériel sur site."]],"q":[["We need ___ information before we decide.",["more","many","a","several"],"information est indénombrable : more."],["There are ___ people in the room; it's almost empty.",["few","a few","little","much"],"Peu de (sens négatif) + dénombrable : few."],["She gave me ___ useful advice.",["some","an","many","a"],"advice est indénombrable : some."]]},{"h":"Comparatifs et structures de comparaison","x":"**-er / more … than** ; **as … as** ; **the … the** (*The sooner, the better*).\nIntensifieurs : **much / far / a lot / slightly / a bit + comparatif**. Pour « deux fois plus » : **twice as … as**.\n**Superlatif** : the -est / the most. *one of the most reliable*.\n**Comparatifs doubles** : *It's getting more and more expensive.*\nAttention : **fewer** (dénombrable) / **less** (indénombrable).","ex":[["This unit is far more efficient than the old one.","Cette unité est bien plus efficace que l'ancienne."],["The more we test, the fewer errors we make.","Plus nous testons, moins nous faisons d'erreurs."],["It's twice as expensive as I expected.","C'est deux fois plus cher que je ne pensais."]],"q":[["The ___ you start, the sooner you'll finish.",["earlier","early","more early","earliest"],"The + comparatif, the + comparatif."],["This model uses ___ energy than the previous one.",["less","fewer","lesser","the least"],"energy est indénombrable : less."],["It's ___ the most reliable system we have.",["by far","very","much","far than"],"By far + superlatif."]]}],"words":[["plenty of","beaucoup de","There is plenty of space."],["a great deal of","beaucoup de (indénombrable)","A great deal of work remains."],["a number of","un certain nombre de","A number of issues remain."],["hardly any","presque pas de","There's hardly any water."],["scarce","rare","Skilled workers are scarce."],["sufficient","suffisant","The supply is sufficient."],["lack of","manque de","There's a lack of clarity."],["shortage","pénurie","A shortage of parts delayed us."],["surplus","excédent","We have a surplus of stock."],["majority","majorité","The majority agreed."],["minority","minorité","Only a minority objected."],["roughly","environ","It costs roughly 2,000 euros."],["approximately","approximativement","Approximately 50 people came."],["at least","au moins","We need at least two engineers."],["at most","au plus","It takes ten minutes at most."],["considerably","considérablement","Costs fell considerably."]],"sents":[["There is far less demand than we expected.","Il y a beaucoup moins de demande que nous ne le pensions."],["The more experience you have, the easier it gets.","Plus tu as d'expérience, plus c'est facile."],["Could you give me a piece of advice?","Pourrais-tu me donner un conseil ?"],["We have hardly any spare parts left.","Il ne nous reste presque plus de pièces de rechange."],["Fewer people attended than last year.","Moins de personnes ont assisté que l'an dernier."],["This is by far the best solution.","C'est de loin la meilleure solution."]],"lv":"B2","can":"J'emploie articles et quantificateurs comme un natif."},{"t":"Phrasal verbs au travail","rules":[{"h":"Particules et sens","x":"**up** : augmenter, achever (speed up, finish up) ; **down** : réduire, arrêter (shut down, cut down) ; **out** : épuiser, distribuer, trouver (run out, hand out, find out) ; **off** : arrêter, partir (switch off, set off) ; **on** : continuer, allumer (carry on, switch on) ; **back** : retour (call back, get back to) ; **through** : traverser, achever (go through, get through).","ex":[["We ran out of spare filters.","Nous n'avons plus de filtres de rechange."],["I'll get back to you tomorrow.","Je reviens vers vous demain."],["Let's go through the figures once more.","Repassons les chiffres encore une fois."]],"q":[["We have ___ of coolant; order more.",["run out","run off","gone out","used up"],"run out of = être à court de."],["I'll ___ you as soon as I have news.",["get back to","go back to","come back","turn back"],"get back to = recontacter."],["The meeting was ___ because of the strike.",["called off","called up","called in","called on"],"call off = annuler."]]}],"words":[["to bring up","soulever (un sujet)","He brought up a safety issue."],["to come up with","trouver (une idée)","She came up with a solution."],["to follow up","donner suite","I'll follow up with the client."],["to hand over","remettre","He handed over the keys."],["to sign off","valider, approuver","The manager signed off the plan."],["to roll out","déployer","We'll roll out the software in May."],["to pick up","reprendre / ramasser","Sales are picking up."],["to cut back","réduire","We must cut back costs."],["to look into","examiner","We'll look into the problem."],["to point out","souligner","I'd like to point out one thing."],["to pass on","transmettre","Please pass on my thanks."],["to back up","sauvegarder / soutenir","Back up your files."],["to sort out","régler","Let's sort out the details."],["to put forward","avancer (une proposition)","He put forward a new idea."],["to take on","embaucher, prendre en charge","We took on two apprentices."],["to wrap up","conclure","Let's wrap up the meeting."]],"sents":[["I'll look into it and get back to you this afternoon.","Je vais étudier ça et revenir vers vous cet après-midi."],["They rolled out the new procedure last week.","Ils ont déployé la nouvelle procédure la semaine dernière."],["Let's wrap up and call it a day.","Concluons et arrêtons-nous là pour aujourd'hui."],["She came up with a clever way to save energy.","Elle a trouvé un moyen astucieux d'économiser l'énergie."],["Could you pass this on to the team?","Pourrais-tu transmettre ça à l'équipe ?"],["We ran out of time before we could finish.","Nous avons manqué de temps avant de pouvoir finir."]],"lv":"B2","can":"J'utilise les phrasal verbs courants au travail."},{"t":"Phrasal verbs de la vie courante","rules":[{"h":"Phrasal verbs à trois mots et sens multiples","x":"Certains verbes ont **trois éléments** : *look forward to, put up with, run out of, get along with, come up with, look down on*. Ils sont inséparables et la dernière particule est une préposition : suivie d'un nom ou d'un -ing.\nUn même phrasal verb peut avoir plusieurs sens : **pick up** = ramasser / apprendre / aller chercher / s'améliorer ; **take off** = décoller / enlever / réussir ; **get over** = se remettre de.\nÀ l'oral, on préfère les phrasal verbs ; à l'écrit formel, leurs équivalents latins.","ex":[["I can't put up with this noise.","Je ne supporte pas ce bruit."],["She picked up Spanish very quickly.","Elle a appris l'espagnol très vite."],["The plane took off on time.","L'avion a décollé à l'heure."]],"q":[["I get ___ well with my colleagues.",["along","over","away","on to"],"get along with = s'entendre avec."],["I'm trying to ___ the flu.",["get over","get up","get on","get by"],"get over = se remettre de."],["She doesn't ___ people who are late.",["put up with","put off","put away","put out to"],"put up with = supporter."]]},{"h":"Phrasal verbs pour les relations, voyages et émotions","x":"**break up** (rompre), **fall out** (se brouiller), **make up** (se réconcilier / inventer), **let down** (décevoir), **count on** (compter sur), **grow up** (grandir), **check in / out** (hôtel), **set off** (partir), **drop off** (déposer), **cheer up** (reprendre courage), **calm down**, **find out**, **work out** (faire du sport / se résoudre).","ex":[["You can count on me.","Tu peux compter sur moi."],["We set off at dawn.","Nous sommes partis à l'aube."],["It didn't work out in the end.","Cela ne s'est pas arrangé finalement."]],"q":[["I felt let ___ by their decision.",["down","up","off","out"],"let down = décevoir."],["We need to ___ at the hotel before noon.",["check out","check off","check up","check to"],"check out = quitter l'hôtel."],["Don't worry, it'll all ___ fine.",["work out","work off","work at","work in"],"work out = se passer bien / s'arranger."]]}],"words":[["to get along with","s'entendre avec","I get along with everyone."],["to put up with","supporter","I won't put up with it."],["to look down on","mépriser","Don't look down on others."],["to look up to","admirer","I look up to my mentor."],["to take after","ressembler à","She takes after her mother."],["to bring up","élever (un enfant)","He was brought up in Lyon."],["to get away","s'échapper, partir en vacances","I need to get away for a week."],["to fall behind","prendre du retard","We fell behind with the payments."],["to catch on","comprendre / devenir populaire","The idea caught on fast."],["to live on","vivre de","They live on a small budget."],["to drop in","passer à l'improviste","Drop in whenever you like."],["to show off","frimer","He likes to show off."],["to turn up","se présenter","Nobody turned up."],["to make out","distinguer","I can't make out the words."],["to hold on","patienter","Hold on a second."],["to end up","finir par","We ended up staying longer."]],"sents":[["I can't put up with this heat any longer.","Je ne supporte plus cette chaleur."],["We ended up taking a taxi.","Nous avons fini par prendre un taxi."],["She really takes after her father.","Elle ressemble vraiment à son père."],["Hold on, I'll check my diary.","Un instant, je vérifie mon agenda."],["He looked up to his old manager.","Il admirait son ancien responsable."],["Nobody turned up to the meeting.","Personne ne s'est présenté à la réunion."]],"lv":"B2","can":"J'utilise les phrasal verbs du quotidien."},{"t":"Collocations et expressions idiomatiques","rules":[{"h":"Collocations verbe + nom","x":"Les collocations sont des associations naturelles qu'on ne peut pas traduire mot à mot.\n**make** : a decision, a mistake, progress, an effort, an appointment, money, a suggestion.\n**do** : business, research, damage, homework, a favour, your best, the dishes.\n**take** : a risk, a break, a decision (UK : take a decision), responsibility, place, part in, notice.\n**have** : a meeting, a look, a word with, an impact, a chance.\n**give** : a presentation, advice, notice, a hand. **pay** : attention, a visit, a compliment.","ex":[["We need to make a decision today.","Nous devons prendre une décision aujourd'hui."],["Please pay attention to the details.","Fais attention aux détails."],["He took full responsibility for the error.","Il a assumé l'entière responsabilité de l'erreur."]],"q":[["We've ___ good progress this month.",["made","done","taken","had"],"make progress."],["The storm ___ serious damage to the roof.",["did","made","gave","took"],"do damage."],["She ___ a presentation to the board.",["gave","did","made to","took"],"give a presentation."]]},{"h":"Idiomes courants du monde professionnel","x":"**the ball is in your court** : c'est à toi de jouer. **to be on the same page** : être d'accord. **to cut corners** : bâcler. **back to square one** : retour à la case départ. **to get the ball rolling** : lancer les choses. **a ballpark figure** : un chiffre approximatif. **to touch base** : reprendre contact. **in the pipeline** : en préparation. **to bite the bullet** : serrer les dents et le faire. **a blessing in disguise** : un mal pour un bien. **to see eye to eye** : être d'accord.","ex":[["Let's touch base next week.","Reprenons contact la semaine prochaine."],["We can't afford to cut corners on safety.","Nous ne pouvons pas bâcler la sécurité."],["The ball is in your court now.","C'est à vous de jouer maintenant."]],"q":[["The results were bad, so we're back to ___.",["square one","the ball","a blessing","the pipeline"],"back to square one = retour à la case départ."],["Can you give me a ___ figure for the cost?",["ballpark","bullet","corner","blessing"],"ballpark figure = ordre de grandeur."],["I think we're all on the same ___.",["page","line","book","side"],"on the same page = d'accord / sur la même longueur d'onde."]]}],"words":[["to meet a deadline","respecter une échéance","We met the deadline."],["to raise a concern","soulever une préoccupation","He raised a concern about safety."],["to reach an agreement","parvenir à un accord","We reached an agreement."],["to draw a conclusion","tirer une conclusion","Let's draw a conclusion."],["to run a risk","courir un risque","You run the risk of overheating."],["to keep in touch","rester en contact","Let's keep in touch."],["to make sense","avoir du sens","That makes sense."],["to take into account","tenir compte de","Take the weather into account."],["to have in mind","avoir en tête","What do you have in mind?"],["to break the news","annoncer la nouvelle","He broke the news gently."],["to lose track of","perdre le fil de","I lost track of time."],["to bear in mind","garder à l'esprit","Bear in mind the budget."],["to catch someone's eye","attirer l'attention","The sign caught my eye."],["to go ahead","aller de l'avant","The project will go ahead."],["to be fed up with","en avoir assez de","I'm fed up with delays."],["a rule of thumb","règle empirique","As a rule of thumb, add 10%."]],"sents":[["We reached an agreement after a long discussion.","Nous sommes parvenus à un accord après une longue discussion."],["Please bear in mind that the budget is limited.","Garde à l'esprit que le budget est limité."],["It's a blessing in disguise that the meeting was cancelled.","C'est un mal pour un bien que la réunion ait été annulée."],["I lost track of time and missed the call.","J'ai perdu la notion du temps et j'ai manqué l'appel."],["As a rule of thumb, allow ten per cent extra.","En règle générale, prévoyez dix pour cent en plus."],["We can't cut corners when safety is at stake.","Nous ne pouvons pas bâcler quand la sécurité est en jeu."]],"lv":"B2","can":"J'emploie les bonnes associations de mots."},{"t":"Connecteurs logiques et cohésion du discours","rules":[{"h":"Opposition, concession, cause, conséquence","x":"**Opposition** : but, however (début de phrase + virgule), whereas, while, on the other hand, in contrast.\n**Concession** : although / even though / though + sujet + verbe ; **despite / in spite of + nom ou -ing** ; **nevertheless, nonetheless**.\n**Cause** : because + proposition ; **because of / due to / owing to + nom** ; since / as.\n**Conséquence** : so, therefore, as a result, consequently, thus, hence.\nAttention : « despite of » n'existe pas.","ex":[["Although it was raining, we continued working.","Bien qu'il pleuve, nous avons continué à travailler."],["Despite the delay, the quality is excellent.","Malgré le retard, la qualité est excellente."]],"q":[["___ the heavy traffic, we arrived on time.",["Despite","Although","Because","However"],"Despite + nom."],["The system is cheap; ___, it is not very reliable.",["however","although","because","despite"],"However : connecteur d'opposition en début de proposition indépendante."],["The meeting was cancelled ___ the strike.",["due to","because","although","despite"],"due to + nom : à cause de."]]},{"h":"Organiser un texte : addition, séquence, exemple, conclusion","x":"**Addition** : moreover, furthermore, in addition, besides, what is more.\n**Séquence** : firstly, secondly, finally, subsequently, afterwards, meanwhile, prior to.\n**Exemple** : for instance, for example, such as, namely.\n**Reformulation** : in other words, that is to say.\n**Conclusion** : in conclusion, to sum up, all things considered, overall.\n**But** : so that, in order to, so as to, in order that.","ex":[["Moreover, the new design saves energy.","De plus, la nouvelle conception économise de l'énergie."],["In other words, we need more time.","Autrement dit, nous avons besoin de plus de temps."],["We left early so as to avoid the traffic.","Nous sommes partis tôt afin d'éviter la circulation."]],"q":[["The plan is cheap. ___, it is quick to implement.",["Moreover","Despite","Unless","Whereas"],"Moreover : ajoute un argument."],["We checked twice ___ avoid any mistake.",["so as to","so as","in order for","to be"],"But : so as to + infinitif."],["___, the project was a success.",["Overall","In spite","Although","Because of"],"Overall : en conclusion / globalement."]]}],"words":[["however","cependant","However, we must be careful."],["nevertheless","néanmoins","Nevertheless, we continued."],["moreover","de plus","Moreover, it is cheaper."],["therefore","par conséquent","Therefore, we decided to wait."],["consequently","en conséquence","Consequently, prices rose."],["thus","ainsi","Thus, the problem was solved."],["in contrast","en revanche","In contrast, the second plan is slower."],["whereas","alors que","He's calm, whereas she's anxious."],["owing to","en raison de","Owing to illness, he was absent."],["so that","afin que","I wrote it down so that I wouldn't forget."],["provided that","pourvu que","Provided that it's safe, we can go."],["as opposed to","par opposition à","Quality as opposed to quantity."],["to sum up","pour résumer","To sum up, we need a new plan."],["in the meantime","en attendant","In the meantime, use the backup."],["all things considered","tout bien considéré","All things considered, it went well."]],"sents":[["Although the cost is high, the benefits are clear.","Bien que le coût soit élevé, les avantages sont clairs."],["The unit failed; therefore, we had to stop production.","L'unité est tombée en panne ; nous avons donc dû arrêter la production."],["Prices increased, whereas salaries stayed the same.","Les prix ont augmenté alors que les salaires sont restés les mêmes."],["In the meantime, please use the temporary solution.","En attendant, veuillez utiliser la solution provisoire."],["Despite working overtime, they missed the deadline.","Malgré les heures supplémentaires, ils ont manqué l'échéance."],["To sum up, three actions are needed.","Pour résumer, trois actions sont nécessaires."]],"lv":"B2","can":"Je relie mes idées clairement à l'oral et à l'écrit."},{"t":"Registre, politesse et nuance","rules":[{"h":"Formel ou informel ?","x":"**Formel** : verbes latins (request, require, inform, assist, purchase), pas de contractions, passif, phrases complètes. **Informel** : phrasal verbs, contractions, expressions courtes.\nExemples : *ask for → request* ; *find out → ascertain* ; *get → obtain* ; *buy → purchase* ; *help → assist* ; *start → commence* ; *end → conclude* ; *show → demonstrate*.\nPolitesse indirecte : **Could / Would you…?**, **I was wondering if…**, **Would you mind…?**, **I'd appreciate it if…**.","ex":[["I was wondering if you could help me.","Je me demandais si vous pouviez m'aider."],["Would you mind closing the door?","Cela vous dérangerait-il de fermer la porte ?"],["We would appreciate your prompt reply.","Nous apprécierions votre réponse rapide."]],"q":[["Formal equivalent of « find out »:",["ascertain","look for","get over","figure"],"ascertain = s'assurer / établir."],["The most polite request:",["I was wondering if you could send it.","Send it.","Can you send it?","You must send it."],"« I was wondering if » est très poli."],["Formal equivalent of « buy »:",["purchase","get up","pick up","take on"],"purchase = acheter (formel)."]]},{"h":"Atténuer et nuancer (hedging)","x":"En anglais professionnel et académique, on évite l'affirmation brutale.\n**Verbes** : seem, appear, tend to, suggest, indicate.\n**Modaux** : may, might, could.\n**Adverbes** : probably, possibly, arguably, apparently, generally, relatively, somewhat, slightly.\n**Expressions** : it would seem that, it is likely that, to some extent, up to a point, as far as I know, in my view.\nPour critiquer poliment : *I see your point, but…* ; *That's one way of looking at it* ; *I'm not entirely convinced*.","ex":[["The results seem to suggest a problem.","Les résultats semblent indiquer un problème."],["This is arguably the best option.","C'est sans doute la meilleure option."],["I see your point, but I'm not entirely convinced.","Je vois votre point de vue, mais je ne suis pas entièrement convaincu."]],"q":[["It ___ that the sensor is faulty.",["would seem","is","must to be","are"],"« It would seem that » atténue l'affirmation."],["To disagree politely:",["I'm not entirely convinced.","You're wrong.","That is stupid.","No way."],"Formule atténuée et polie."],["The figures are ___ higher than last year.",["slightly","slight","slighty","slightness"],"adverbe : slightly."]]}],"words":[["to request","demander (formel)","I request a meeting."],["to require","exiger, nécessiter","This requires approval."],["to inform","informer","Please inform us of any change."],["to assist","aider (formel)","We will assist you."],["to obtain","obtenir","You can obtain a permit online."],["to commence","commencer (formel)","Works will commence on Monday."],["to conclude","conclure","To conclude, we agree."],["to demonstrate","démontrer","He demonstrated the new device."],["to ascertain","s'assurer, établir","We must ascertain the cause."],["to inquire","se renseigner","I'm writing to inquire about prices."],["kindly","aimablement","Kindly confirm receipt."],["arguably","sans doute, on peut soutenir que","He is arguably the best."],["somewhat","quelque peu","The result is somewhat disappointing."],["relatively","relativement","It's relatively simple."],["to some extent","dans une certaine mesure","To some extent, I agree."],["up to a point","jusqu'à un certain point","Up to a point, yes."]],"sents":[["I would be grateful if you could confirm receipt.","Je vous serais reconnaissant de bien vouloir confirmer la réception."],["It would seem that the supplier has changed the specification.","Il semblerait que le fournisseur ait modifié la spécification."],["To some extent, I agree with you.","Dans une certaine mesure, je suis d'accord avec vous."],["Would you mind sending me the figures?","Cela vous dérangerait-il de m'envoyer les chiffres ?"],["The results are somewhat disappointing.","Les résultats sont plutôt décevants."],["I see your point, but I'm not entirely convinced.","Je vois votre point de vue, mais je ne suis pas entièrement convaincu."]],"lv":"B2","can":"J'adapte mon ton à la situation."},{"t":"Réunions, négociation et prise de parole","rules":[{"h":"Mener et suivre une réunion","x":"**Ouvrir** : Let's get started. / Shall we begin? / The purpose of today's meeting is to…\n**Ordre du jour** : first on the agenda; moving on to; any other business (AOB).\n**Donner la parole** : Would you like to add anything? / Over to you.\n**Interrompre poliment** : Sorry to interrupt, but… / Can I just come in here?\n**Clarifier** : What do you mean by…? / Could you elaborate on that?\n**Conclure** : To wrap up… / Let's recap the action points. / Who is going to take this forward?\nVocabulaire : minutes, action points, chair, agenda, quorum.","ex":[["Sorry to interrupt, but could I add something?","Désolé de vous interrompre, mais puis-je ajouter quelque chose ?"],["Let's recap the action points.","Récapitulons les points d'action."],["Could you elaborate on that?","Pourriez-vous développer ce point ?"]],"q":[["To politely interrupt:",["Sorry to interrupt, but…","Stop talking.","Listen to me.","That's wrong."],"Formule polie d'interruption."],["The written record of a meeting is called the ___.",["minutes","agenda","chair","quorum"],"minutes = compte rendu."],["To ask someone to give more detail:",["Could you elaborate on that?","Could you cut that?","Do you elaborate?","Can you elaborating?"],"elaborate on = développer."]]},{"h":"Négocier : proposer, concéder, refuser","x":"**Proposer** : What if we…? / How about…? / We could offer…\n**Conditionner** : If you can… we would be prepared to… / Provided that…\n**Concéder** : I take your point. / We're willing to meet you halfway.\n**Refuser poliment** : I'm afraid that won't be possible. / That's a bit beyond our budget. / We'd find that difficult to accept.\n**Conclure** : Do we have a deal? / Let's shake on it. / We'll put it in writing.\nVocabulaire : bargaining, leverage, bottom line, trade-off, concession, quote, discount.","ex":[["If you can deliver by June, we would be prepared to pay more.","Si vous pouvez livrer en juin, nous serions prêts à payer plus."],["I'm afraid that won't be possible.","Je crains que ce ne soit pas possible."],["Let's meet you halfway.","Faisons chacun la moitié du chemin."]],"q":[["The lowest price you can accept is your ___.",["bottom line","leverage","quote","trade"],"bottom line = seuil minimal."],["Polite way to refuse:",["I'm afraid that won't be possible.","No.","Never.","That is silly."],"Refus atténué."],["Giving something up in exchange for something else:",["trade-off","kick-off","set-up","write-off"],"trade-off = compromis."]]}],"words":[["agenda","ordre du jour","The agenda is on the table."],["minutes","compte rendu","I'll send the minutes."],["action point","point d'action","Three action points were agreed."],["to chair","présider","She chairs the weekly meeting."],["attendee","participant","Ten attendees joined."],["to adjourn","ajourner","The meeting was adjourned."],["to table","mettre sur la table / reporter (UK/US)","Let's table this proposal."],["to elaborate","développer","Could you elaborate?"],["to clarify","clarifier","Let me clarify the point."],["to recap","récapituler","Let me recap."],["negotiation","négociation","The negotiation lasted hours."],["concession","concession","We made a concession."],["leverage","levier, influence","We have little leverage."],["quote","devis","Please send a quote."],["discount","remise","They offered a 10% discount."],["to counter-offer","faire une contre-proposition","We counter-offered at 90%."],["deal","accord","Do we have a deal?"],["stakeholder","partie prenante","All stakeholders were informed."]],"sents":[["The purpose of today's meeting is to review the schedule.","L'objet de la réunion d'aujourd'hui est de revoir le planning."],["I take your point, but we can't go any lower.","Je comprends votre point de vue, mais nous ne pouvons pas descendre plus bas."],["If you commit to a larger order, we would be willing to offer a discount.","Si vous vous engagez sur une commande plus importante, nous serions prêts à faire une remise."],["Could we move on to the next item on the agenda?","Pourrions-nous passer au point suivant de l'ordre du jour ?"],["Who is going to take this action forward?","Qui va prendre cette action en charge ?"],["Let's put the agreement in writing.","Mettons l'accord par écrit."]],"lv":"B2","can":"Je participe à une réunion et je négocie."},{"t":"E-mails et rapports professionnels","rules":[{"h":"Structure et formules d'un e-mail","x":"**Ouverture** : Dear Mr / Ms Smith, (formel) ; Hi Sarah, (informel) ; Dear all, (groupe).\n**Raison** : I am writing to… / I'm getting in touch regarding… / Further to our call, …\n**Corps** : Please find attached… / I would like to draw your attention to… / Could you please confirm…\n**Rappel** : Just a gentle reminder that… / I'm following up on…\n**Fin** : I look forward to hearing from you. / Thank you in advance. / Please do not hesitate to contact me.\n**Signature** : Kind regards (neutre) ; Yours sincerely (si Dear Mr Smith) ; Best wishes / Best (informel).\n**Pièce jointe** : attachment ; on met « find attached », pas « joined ».","ex":[["I am writing to confirm our meeting on Friday.","Je vous écris pour confirmer notre réunion de vendredi."],["Please find attached the revised schedule.","Veuillez trouver ci-joint le planning révisé."],["Please do not hesitate to contact me.","N'hésitez pas à me contacter."]],"q":[["___ the signed contract, please find it attached.",["Regarding","Joined","Annexed to","About of"],"Regarding / Concerning : au sujet de."],["Standard closing for an email to Dear Mr Smith:",["Yours sincerely","See you","Cheers","Best of luck mate"],"Registre formel."],["Polite way to ask for confirmation:",["Could you please confirm receipt?","Confirm now.","You confirm?","Do confirm to me."],"Formule polie."]]}],"words":[["to attach","joindre","I attached the file."],["attachment","pièce jointe","See the attachment."],["to forward","transférer","Please forward this to the team."],["to reply all","répondre à tous","Don't reply all."],["regarding","concernant","Regarding your request,…"],["further to","suite à","Further to our call,…"],["in advance","à l'avance","Thank you in advance."],["to enclose","joindre (courrier)","I enclose a copy."],["to draw attention to","attirer l'attention sur","I'd like to draw attention to the cost."],["to acknowledge","accuser réception","We acknowledge your email."],["to apologise for","s'excuser de","We apologise for the delay."],["executive summary","synthèse","Read the executive summary first."],["findings","constatations","The findings were clear."],["recommendation","recommandation","We made three recommendations."],["appendix","annexe","See the appendix."],["to peak","atteindre un pic","Demand peaked in July."],["to level off","se stabiliser","Prices levelled off."],["to fluctuate","fluctuer","Temperatures fluctuate daily."]],"sents":[["I am writing to follow up on our meeting last week.","Je vous écris pour faire suite à notre réunion de la semaine dernière."],["Please find attached the test report for your review.","Veuillez trouver ci-joint le rapport d'essai pour relecture."],["We apologise for any inconvenience this may cause.","Nous nous excusons pour la gêne occasionnée."],["Energy use fell sharply after the upgrade.","La consommation d'énergie a nettement baissé après la modernisation."],["It is recommended that all filters be replaced.","Il est recommandé de remplacer tous les filtres."],["I look forward to hearing from you.","Dans l'attente de votre réponse."]],"lv":"B2","can":"J'écris un e-mail et un rapport professionnels."},{"t":"Voyages, services et situations du quotidien","rules":[{"h":"Demander, réserver, se plaindre","x":"**Demander un service** : Could I have…? / I'd like to… / Is it possible to…? / Do you happen to know…?\n**Réserver** : I'd like to book a table for four at eight. / Is there any availability?\n**Se renseigner** : What time does… leave? / How far is it? / Could you tell me where… is? (question indirecte : ordre affirmatif).\n**Se plaindre** : I'm afraid there's a problem with… / I'd like to make a complaint. / It doesn't work properly. / I'd like a refund.\n**Remercier / s'excuser** : Much appreciated / I do apologise / No worries / Not at all.","ex":[["Could you tell me where the station is?","Pourriez-vous me dire où se trouve la gare ?"],["I'd like to make a complaint.","Je voudrais faire une réclamation."],["Is there any availability on Friday?","Y a-t-il des disponibilités vendredi ?"]],"q":[["Could you tell me what time ___?",["the train leaves","does the train leave","leaves the train","the train does leave"],"Question indirecte : ordre affirmatif."],["To ask for your money back:",["I'd like a refund.","I want money back it.","Give refund to me.","I ask for return."],"refund = remboursement."],["A polite answer to « Thank you »:",["Not at all.","Yes, of course.","No thanks.","Never."],"Not at all / You're welcome."]]},{"h":"À l'aéroport, à l'hôtel, au restaurant","x":"**Aéroport** : boarding pass, gate, carry-on luggage, checked baggage, delay, connecting flight, customs, security check.\n**Hôtel** : reservation, check in / check out, single / double room, en-suite, complimentary breakfast, wake-up call.\n**Restaurant** : starter, main course, dessert, the bill (UK) / the check (US), tip, service charge, to be fully booked, dietary requirements.\n**Transports** : single / return ticket, platform, fare, to commute, rush hour, to miss / catch a train.","ex":[["Could I have the bill, please?","Pourrais-je avoir l'addition, s'il vous plaît ?"],["My flight has been delayed by two hours.","Mon vol a été retardé de deux heures."],["I'd like a double room with a view.","Je voudrais une chambre double avec vue."]],"q":[["In the US, the restaurant bill is called the ___.",["check","fare","tip","gate"],"US : the check."],["A ticket for a round trip (UK):",["return","single","platform","fare"],"return ticket = aller-retour."],["A bag you take on board:",["carry-on luggage","checked baggage","hold luggage only","customs bag"],"carry-on = bagage cabine."]]}],"words":[["boarding pass","carte d'embarquement","Show your boarding pass."],["gate","porte d'embarquement","Go to gate 12."],["delay","retard","There's a two-hour delay."],["luggage","bagages","My luggage is lost."],["customs","douane","We cleared customs."],["fare","tarif (transport)","The fare is 12 euros."],["single ticket","aller simple","A single ticket, please."],["return ticket","aller-retour","A return to Leeds."],["reservation","réservation","I have a reservation."],["availability","disponibilité","Is there availability?"],["refund","remboursement","I want a refund."],["complimentary","offert","Breakfast is complimentary."],["receipt","reçu","Keep the receipt."],["tip","pourboire","I left a tip."],["to book","réserver","We booked a table."],["to commute","faire la navette","I commute by train."],["rush hour","heure de pointe","Avoid rush hour."],["to miss","rater","We missed the bus."]],"sents":[["Could you tell me where I can find a taxi?","Pourriez-vous me dire où je peux trouver un taxi ?"],["Our flight was delayed because of fog.","Notre vol a été retardé à cause du brouillard."],["I'd like to book a table for four at eight o'clock.","Je voudrais réserver une table pour quatre à vingt heures."],["Is breakfast included in the price?","Le petit déjeuner est-il compris dans le prix ?"],["I'm afraid there is a problem with the air conditioning.","Je crains qu'il y ait un problème avec la climatisation."],["We missed the last train, so we took a taxi.","Nous avons raté le dernier train, alors nous avons pris un taxi."]],"lv":"B2","can":"Je me débrouille en voyage et dans les services."},{"t":"Conversation, opinions et expressions naturelles","rules":[{"h":"Exprimer son opinion, accord et désaccord","x":"**Opinion** : In my opinion… / As far as I'm concerned… / From my point of view… / I tend to think that… / It strikes me that…\n**Accord** : Absolutely. / I couldn't agree more. / That's exactly what I think. / You have a point.\n**Désaccord** : I'm not so sure. / I see it differently. / I'm afraid I disagree. / Up to a point.\n**Demander l'avis** : What do you make of…? / How do you feel about…? / What's your take on…?\n**Gagner du temps** : Let me think. / Well, / To be honest, / Actually, / As a matter of fact,","ex":[["I couldn't agree more.","Je suis tout à fait d'accord."],["What's your take on the new policy?","Que penses-tu de la nouvelle politique ?"],["To be honest, I'm not so sure.","Pour être honnête, je n'en suis pas si sûr."]],"q":[["Strong agreement:",["I couldn't agree more.","I couldn't agree less.","I couldn't to agree.","I can't agree to more."],"« I couldn't agree more » = totalement d'accord."],["Asking for someone's view:",["What's your take on it?","What is take you?","Where is your take?","How take you?"],"take = point de vue."],["Polite disagreement:",["I see it differently.","You are idiot.","That's rubbish.","I don't agree to you."],"Formule polie."]]},{"h":"Small talk, tags de question et réponses courtes","x":"**Question tags** : phrase affirmative + tag négatif, et inversement. *It's cold, isn't it?* *You didn't call, did you?* *I'm late, aren't I?*\n**Réponses courtes** : *So do I / Neither do I / So have I / Neither am I*.\n**Réactions** : Really? / No way! / That's great! / What a shame! / How come? / I see.\n**Small talk** : How was your weekend? / Did you have a good trip? / Busy day? / Any plans for the holidays?\nÀ éviter de traduire mot à mot : « I am agree » → I agree ; « I have 30 years » → I'm 30 ; « It depends of » → It depends on.","ex":[["You've been here before, haven't you?","Tu es déjà venu ici, n'est-ce pas ?"],["I love this city. — So do I.","J'adore cette ville. — Moi aussi."],["I can't swim. — Neither can I.","Je ne sais pas nager. — Moi non plus."]],"q":[["She doesn't work here, ___?",["does she","doesn't she","is she","isn't she"],"Phrase négative : tag affirmatif."],["I'm tired. — ___ am I.",["So","Neither","Also","Too"],"Accord positif avec be : So am I."],["I ___ 35 years old.",["am","have","do","make"],"En anglais l'âge se dit avec be."]]}],"words":[["to be honest","pour être honnête","To be honest, I'm tired."],["as a matter of fact","en fait","As a matter of fact, I agree."],["by the way","au fait","By the way, I called him."],["actually","en fait (en réalité)","Actually, it's cheaper."],["really","vraiment","It's really good."],["how come","comment ça se fait","How come you're late?"],["no way","pas question / pas possible","No way, that's amazing!"],["such a shame","quel dommage","It's such a shame."],["fair enough","d'accord, c'est juste","Fair enough."],["to be in a hurry","être pressé","I'm in a hurry."],["to catch up with","se mettre à jour avec","Let's catch up soon."],["to run errands","faire des courses","I ran errands all day."],["to hang out","traîner","We hang out on weekends."],["to look forward to","avoir hâte","I'm looking forward to it."],["cheers","santé / merci (UK)","Cheers, mate!"],["worth it","qui en vaut la peine","It was worth it."],["a piece of cake","du gâteau (facile)","The test was a piece of cake."]],"sents":[["It's a lovely day, isn't it?","Il fait beau, n'est-ce pas ?"],["I couldn't agree more with what you said.","Je suis tout à fait d'accord avec ce que tu as dit."],["To be honest, I'm not sure it's worth it.","Pour être honnête, je ne suis pas sûr que cela en vaille la peine."],["How was your weekend? Did you do anything special?","Comment était ton week-end ? Tu as fait quelque chose de spécial ?"],["Neither of us had been there before.","Aucun de nous n'y était déjà allé."],["Let's catch up over coffee next week.","Retrouvons-nous autour d'un café la semaine prochaine."]],"lv":"B2","can":"Je donne mon avis avec naturel."},{"t":"Faux amis et pièges français → anglais","rules":[{"h":"Les faux amis les plus fréquents","x":"Ressemblent au français mais ont un autre sens :\n**actually** = en fait (≠ actuellement → currently). **eventually** = finalement (≠ éventuellement → possibly). **sensible** = raisonnable (≠ sensible → sensitive). **to assist** = aider (≠ assister à → attend). **library** = bibliothèque (≠ librairie → bookshop). **to pretend** = faire semblant (≠ prétendre → claim). **demand** = exiger / demande (marché) (≠ demander → ask). **lecture** = cours magistral (≠ lecture → reading). **a college** = établissement d'études (≠ collège). **resume** = reprendre (CV = CV / résumé US). **injury** = blessure. **sympathetic** = compatissant (≠ sympathique → nice). **location** = emplacement (≠ location → rental). **to attend** = assister à (≠ attendre → wait).","ex":[["I'm currently working on a new project.","Je travaille actuellement sur un nouveau projet."],["He attended the conference in Paris.","Il a assisté à la conférence à Paris."],["The library is closed on Sundays.","La bibliothèque est fermée le dimanche."]],"q":[["« Actuellement » in English:",["currently","actually","eventually","presently only"],"actually = en fait ; currently = actuellement."],["« J'ai assisté à la réunion »:",["I attended the meeting.","I assisted the meeting.","I assisted at the meeting.","I attended to the meeting."],"attend = assister à."],["« Il est très sympathique »:",["He is very nice.","He is very sympathetic.","He is very sensible.","He is very sympathique."],"sympathetic = compatissant."]]},{"h":"Erreurs typiques de syntaxe et de prépositions","x":"**Adjectif devant le nom**, pas après : *a big problem*. **Pas de « s » à l'adjectif**. **I agree** (pas « I am agree »). **It depends on**. **I'm 30** / **I'm cold** (be, pas have). **Since / for** : since + point de départ, for + durée. **Make / let / have + infinitif sans to**. **Informations → information (indénombrable)**. **People are** (pluriel). **Look at / listen to / wait for** : la préposition est obligatoire. **Married to**. **Interested in**. **Good at**. **Different from / to**. **Arrive in (ville) / at (lieu)**. **Discuss something** (sans about). **Explain something to someone**.","ex":[["We discussed the problem for an hour.","Nous avons discuté du problème pendant une heure."],["She is married to an engineer.","Elle est mariée à un ingénieur."],["I've been waiting for you since noon.","Je t'attends depuis midi."]],"q":[["We need to ___ the budget.",["discuss","discuss about","talk","speak"],"discuss se construit sans préposition."],["I've lived here ___ 2018.",["since","for","from","during"],"since + point de départ."],["He arrived ___ London yesterday.",["in","at","to","on"],"arrive in + ville."]]}],"words":[["actually","en fait","Actually, I disagree."],["currently","actuellement","He is currently abroad."],["eventually","finalement","Eventually, we found it."],["possibly","éventuellement","Possibly next week."],["sensible","raisonnable","A sensible decision."],["sensitive","sensible","She is very sensitive."],["to attend","assister à","Attend the training."],["to wait for","attendre","Wait for me."],["to assist","aider","Please assist him."],["library","bibliothèque","I borrowed a book from the library."],["bookshop","librairie","The bookshop is closed."],["to pretend","faire semblant","He pretended to sleep."],["to claim","prétendre","He claims to be an expert."],["injury","blessure","He had a minor injury."],["lecture","cours magistral","The lecture lasted an hour."],["reading","lecture","Reading is relaxing."],["rent","loyer / louer","The rent is high."],["location","emplacement","The location is perfect."]],"sents":[["She eventually found the cause of the problem.","Elle a fini par trouver la cause du problème."],["We discussed the schedule for an hour.","Nous avons discuté du planning pendant une heure."],["He claims that he never received the email.","Il prétend n'avoir jamais reçu l'e-mail."],["Could you explain the procedure to me?","Pourriez-vous m'expliquer la procédure ?"],["I'm interested in improving my English.","Je m'intéresse à l'amélioration de mon anglais."]],"lv":"B2","can":"J'évite les pièges des faux amis."},{"t":"Mots qu'on confond","rules":[{"h":"Paires qui prêtent à confusion","x":"**affect** (verbe : influencer) / **effect** (nom : effet). **advice** (nom) / **advise** (verbe). **lose** (perdre) / **loose** (lâche). **raise** (lever, transitif) / **rise** (monter, intransitif). **lay** (poser) / **lie** (être allongé). **borrow** (emprunter) / **lend** (prêter). **bring** (apporter vers ici) / **take** (emporter ailleurs). **say** / **tell** (tell someone). **hear** / **listen**. **see / look / watch**. **economic** (de l'économie) / **economical** (économe). **historic** (marquant) / **historical** (relatif à l'histoire). **principal** / **principle**. **stationary** (immobile) / **stationery** (papeterie).","ex":[["The delay affected the whole project.","Le retard a affecté tout le projet."],["Can I borrow your pen? — Sure, I'll lend you one.","Puis-je emprunter ton stylo ? — Bien sûr, je t'en prête un."],["Prices rise in winter; they raise costs.","Les prix montent en hiver ; ils augmentent les coûts."]],"q":[["The new rules will ___ everyone.",["affect","effect","effects","affects to"],"affect = influencer (verbe)."],["Could you ___ me your charger?",["lend","borrow","bring","rise"],"lend = prêter."],["Please ___ your laptop to the meeting.",["bring","take","carry away","lend"],"bring = apporter (vers le lieu de la réunion)."]]},{"h":"Adverbes et adjectifs trompeurs","x":"**hard / hardly** (dur / à peine). **late / lately** (en retard / dernièrement). **near / nearly** (proche / presque). **high / highly** (haut / très). **fast** (adj et adv) ≠ « fastly ». **good → well** (adverbe). **economic / economical**. **a few / few**. **all / whole** : the whole day. **ago / before**. **still / yet / already** : still (toujours), yet (pas encore, questions), already (déjà).\n**Make / do** : make a mistake / do a job. **Since / ago**.\n**Look forward to + -ing**.","ex":[["He works hard and rarely complains.","Il travaille dur et se plaint rarement."],["I've hardly slept this week.","J'ai à peine dormi cette semaine."],["Have you finished yet? — Not yet.","As-tu fini ? — Pas encore."]],"q":[["She has ___ any experience; she's just started.",["hardly","hard","hardness","hardy"],"hardly any = presque aucune."],["I haven't seen him ___.",["lately","late","latest","latelier"],"lately = récemment."],["The work is ___ finished.",["nearly","near","nearness","neared"],"nearly = presque."]]}],"words":[["affect","affecter","This will affect prices."],["effect","effet","The effect was immediate."],["advice","conseil","Take my advice."],["advise","conseiller","I advise caution."],["lose","perdre","Don't lose the key."],["loose","desserré","A loose connection."],["raise","lever, augmenter","Raise the price."],["rise","monter","Prices rise."],["lend","prêter","Lend me a pen."],["borrow","emprunter","Can I borrow it?"],["bring","apporter","Bring a laptop."],["take","emporter","Take this with you."],["economic","économique (de l'économie)","An economic crisis."],["economical","économe","An economical car."],["principal","principal","The principal reason."],["principle","principe","A basic principle."],["stationary","immobile","The vehicle was stationary."],["stationery","papeterie","Order some stationery."]],"sents":[["This delay will seriously affect the schedule.","Ce retard va sérieusement affecter le planning."],["Could you lend me your notes from the meeting?","Pourrais-tu me prêter tes notes de la réunion ?"],["I'd advise you to follow his advice.","Je te conseille de suivre son conseil."],["Be careful not to lose the key.","Fais attention à ne pas perdre la clé."],["The new policy has had a positive effect.","La nouvelle politique a eu un effet positif."],["Prices have risen sharply lately.","Les prix ont fortement augmenté dernièrement."]],"lv":"B2","can":"Je distingue les mots qu'on confond souvent."},{"t":"Prononciation et accentuation","rules":[{"h":"Accent de mot et sons pièges pour un francophone","x":"L'anglais est **accentué** : une syllabe est forte, les autres sont faibles (voyelle réduite en schwa /ə/). **photograph** /ˈfəʊtəgrɑːf/, **photographer** /fəˈtɒgrəfə/, **photographic** /ˌfəʊtəˈɡræfɪk/.\nRègles utiles : noms de 2 syllabes → accent sur la 1re (**REcord**), verbes → 2e (**reCORD**). Mots en -tion, -ic, -ical, -ity : accent sur la syllabe **avant** le suffixe (**inforMAtion, ecoNOmic, abiLity**).\nSons difficiles : **th** /θ/ (think) et /ð/ (this) ; **h** aspiré (house) ; **-ed** : /t/ (worked), /d/ (played), /ɪd/ (needed) ; **i** court /ɪ/ (ship) vs long /iː/ (sheep).","ex":[["I need to record the data. Keep a record of it.","Je dois enregistrer les données. Garde-en une trace."],["The meeting is important.","La réunion est importante."],["They worked, played and waited.","Ils ont travaillé, joué et attendu."]],"q":[["Stress in « information »:",["inforMAtion","INformation","informaTION","INFORmation"],"Accent sur la syllabe avant -tion."],["Pronunciation of « worked »:",["/wɜːkt/","/wɜːkɪd/","/wɜːkd/","/wɔːkət/"],"Après son sourd : /t/."],["Noun « record » is stressed on:",["the first syllable","the second syllable","both","neither"],"Nom : REcord ; verbe : reCORD."]]},{"h":"Rythme, intonation et mots de liaison","x":"L'anglais est une langue **à accents** : mots de contenu (noms, verbes, adjectifs, adverbes) accentués, mots grammaticaux faibles (the, of, to, and). *I'll **CALL** you **TOmorrow**.*\n**Intonation** : descendante pour les affirmations et questions en wh- ; montante pour les questions oui/non et les listes (non finales).\n**Liaisons** : consonne + voyelle : *pick it up* /ˈpɪkɪtʌp/. **Formes faibles** : *to* /tə/, *can* /kən/, *and* /ən/. **Contractions** : *gonna, wanna, gotta* (informel) = going to, want to, got to.\n**Britannique / américain** : water /ˈwɔːtə/ vs /ˈwɑːɾɚ/ ; schedule /ˈʃedjuːl/ vs /ˈskedʒuːl/ ; tomato /təˈmɑːtəʊ/ vs /təˈmeɪtoʊ/.","ex":[["What do you want to do?","Qu'est-ce que tu veux faire ?"],["Can you come tomorrow?","Peux-tu venir demain ?"],["Pick it up and put it on the table.","Ramasse-le et pose-le sur la table."]],"q":[["In « I'll call you tomorrow », the most stressed words are:",["call and tomorrow","I'll and you","you only","all equal"],"Mots de contenu accentués."],["Intonation of a wh- question usually:",["falls","rises","stays flat","wobbles"],"Descendante pour les wh-."],["The informal contraction of « going to »:",["gonna","wanna","gotta","hafta"],"gonna = going to."]]}],"words":[["schedule","planning","The schedule is tight."],["comfortable","confortable","A comfortable chair."],["vegetable","légume","Eat your vegetables."],["February","février","In February."],["Wednesday","mercredi","On Wednesday."],["through","à travers","Through the door."],["thorough","minutieux","A thorough check."],["though","bien que","Though it's late."],["enough","assez","That's enough."],["business","affaires","Business is good."],["engineer","ingénieur","An engineer."],["recipe","recette","A good recipe."],["island","île","An island."],["honest","honnête","An honest answer."],["receipt","reçu","Keep the receipt."],["debt","dette","In debt."],["subtle","subtil","A subtle change."],["knowledge","connaissance","Share your knowledge."]],"sents":[["The schedule for Wednesday is quite thorough.","Le planning de mercredi est assez détaillé."],["Though it was late, we kept working.","Bien qu'il fût tard, nous avons continué à travailler."],["He explained the procedure in a clear and honest way.","Il a expliqué la procédure de manière claire et honnête."],["I'll call you tomorrow to check the details.","Je t'appelle demain pour vérifier les détails."],["There isn't enough space for another unit.","Il n'y a pas assez de place pour une autre unité."],["Could you repeat the last sentence, please?","Pourriez-vous répéter la dernière phrase, s'il vous plaît ?"]],"lv":"B2","can":"Je place l'accent des mots correctement."},{"t":"Contrats, devis et aspects juridiques","rules":[{"h":"Le langage des contrats : shall, may, must","x":"Dans un contrat, les modaux ont un sens précis :\n**shall** : obligation (The Contractor shall deliver…). **must** : obligation forte / exigence. **may** : droit ou permission. **shall not / may not** : interdiction. **should** : recommandation, non contraignant.\nOn emploie aussi : **hereby, herein, hereafter, thereof, whereas** (considérant que), **notwithstanding** (nonobstant), **subject to** (sous réserve de), **in accordance with** (conformément à), **pursuant to** (en application de), **null and void** (nul et non avenu).\nStyle : phrases longues, passif, aucune contraction.","ex":[["The Contractor shall complete the works by 30 June.","L'entrepreneur doit achever les travaux avant le 30 juin."],["The Client may terminate the agreement with 30 days' notice.","Le client peut résilier le contrat avec un préavis de 30 jours."],["Payment is due in accordance with Clause 5.","Le paiement est dû conformément à l'article 5."]],"q":[["The Supplier ___ deliver all items within 14 days. (obligation)",["shall","may","might","could"],"« shall » exprime l'obligation dans un contrat."],["The Client ___ cancel the order. (it is allowed to)",["may","shall","must not","ought"],"« may » = droit ou permission."],["Works must be carried out ___ the specification.",["in accordance with","in spite of","owing of","as per to"],"in accordance with = conformément à."]]},{"h":"Retards, pénalités, garanties et réclamations","x":"**Delay** : retard ; **liquidated damages** : pénalités de retard forfaitaires ; **penalty clause** ; **force majeure** : cas de force majeure ; **warranty / guarantee** : garantie ; **defects liability period** : période de garantie des défauts ; **retention** : retenue de garantie ; **variation / change order** : avenant, ordre de modification ; **claim** : réclamation ; **dispute** : litige ; **arbitration** : arbitrage ; **jurisdiction** : juridiction compétente.\nTournures : *failure to comply with*, *in the event of*, *without prejudice to*, *at the Client's expense*, *to be liable for*, *to indemnify against*.","ex":[["In the event of delay, liquidated damages shall apply.","En cas de retard, des pénalités forfaitaires s'appliquent."],["The Contractor is liable for any defects during the warranty period.","L'entrepreneur est responsable de tout défaut pendant la période de garantie."],["Any variation must be approved in writing.","Toute modification doit être approuvée par écrit."]],"q":[["A written change to the scope of work is a ___.",["variation","retention","warranty","claim only"],"variation / change order = avenant."],["___ of delay, the Contractor shall pay damages.",["In the event","In spite","On account","By means"],"In the event of = en cas de."],["An amount held back until the end of the warranty is the ___.",["retention","penalty","quote","fee only"],"retention = retenue de garantie."]]}],"words":[["contract","contrat","Sign the contract."],["agreement","accord","A written agreement."],["clause","clause, article","See Clause 7."],["party","partie","Both parties agree."],["scope of work","périmètre des travaux","Define the scope of work."],["tender","appel d'offres","We submitted a tender."],["bid","offre","The lowest bid won."],["quotation","devis","Send a quotation."],["purchase order","bon de commande","Issue a purchase order."],["invoice","facture","Pay the invoice."],["payment terms","conditions de paiement","Payment terms: 30 days."],["breach","manquement","A breach of contract."],["to terminate","résilier","He terminated the contract."],["to renew","renouveler","We renewed the contract."],["liable","responsable (juridiquement)","He is liable for damages."],["to indemnify","indemniser","We will indemnify you."],["liquidated damages","pénalités de retard","Liquidated damages apply."],["warranty","garantie","The warranty lasts two years."],["dispute","litige","A dispute arose."],["force majeure","force majeure","A force majeure event."]],"sents":[["The Contractor shall notify the Client of any delay in writing.","L'entrepreneur doit notifier tout retard par écrit au client."],["Payment is due thirty days after receipt of the invoice.","Le paiement est dû trente jours après réception de la facture."],["Either party may terminate this agreement with written notice.","Chaque partie peut résilier le présent accord avec un préavis écrit."],["Any variation to the scope of work requires prior approval.","Toute modification du périmètre des travaux nécessite une approbation préalable."],["The warranty covers defects in materials and workmanship.","La garantie couvre les défauts de matériaux et de main-d'œuvre."],["In the event of a dispute, the parties shall seek arbitration.","En cas de litige, les parties recourront à l'arbitrage."]],"lv":"B2","can":"Je comprends un contrat et un devis."},{"t":"Sécurité, qualité et chantier","rules":[{"h":"Consignes de sécurité : impératif, modaux, panneaux","x":"Les panneaux utilisent l'**impératif** (Wear a helmet) ou l'**interdiction** (No smoking, Do not enter). **Danger** (risque grave), **Warning**, **Caution** (risque modéré), **Notice**.\nÉquipements : **PPE** (personal protective equipment), **hard hat / helmet**, **safety glasses**, **gloves**, **high-visibility vest**, **safety boots**, **harness**, **ear defenders**.\nProcédures : **permit to work**, **lockout / tagout (LOTO)**, **risk assessment**, **toolbox talk**, **method statement (RAMS)**, **near miss**, **incident report**, **emergency exit**, **assembly point**, **first aid**.\nOn dit « a near miss » (un presque-accident), « to report an accident », « to isolate the power ».","ex":[["Always wear your PPE on site.","Portez toujours vos EPI sur le chantier."],["Lock out and tag out the equipment before maintenance.","Consignez l'équipement avant la maintenance."],["Report every near miss to your supervisor.","Signalez chaque presque-accident à votre responsable."]],"q":[["A hazard that could have caused an injury but did not:",["near miss","accident","permit","drill"],"near miss = presque-accident."],["A document authorising dangerous work:",["permit to work","toolbox talk","assembly point","first aid"],"permit to work = permis de travail."],["The protective equipment you wear is called ___.",["PPE","RAMS","LOTO","BMS"],"PPE = personal protective equipment."]]},{"h":"Qualité, non-conformités et inspection","x":"**Quality assurance (QA)** : prévention ; **quality control (QC)** : contrôle. **Inspection and test plan (ITP)**, **checklist**, **hold point** (point d'arrêt), **witness point**, **non-conformity report (NCR)**, **corrective action** (action corrective), **preventive action**, **root cause analysis**, **as-built drawings** (plans de récolement), **snag** (réserve), **sign-off**, **audit**, **traceability**, **calibration certificate**.\nPhrases utiles : *The work does not conform to the specification.* / *This item has been rejected.* / *Corrective actions have been implemented.* / *We need to establish the root cause.*","ex":[["Work cannot proceed beyond this hold point without approval.","Les travaux ne peuvent pas continuer au-delà de ce point d'arrêt sans approbation."],["We need to establish the root cause.","Nous devons établir la cause racine."]],"q":[["A point where work must stop until it is inspected:",["hold point","start point","dead point","snag point"],"hold point = point d'arrêt."],["Drawings showing what was actually built:",["as-built drawings","preliminary drawings","tender drawings","freehand drawings"],"as-built = plans de récolement."],["A formal report of work that does not meet requirements:",["non-conformity report","quality quote","audit invoice","method order"],"NCR = rapport de non-conformité."]]}],"words":[["hazard","danger","Identify every hazard."],["risk assessment","évaluation des risques","Complete a risk assessment."],["PPE","EPI","Wear your PPE."],["hard hat","casque de chantier","Hard hats are mandatory."],["harness","harnais","Wear a harness at height."],["scaffolding","échafaudage","The scaffolding is unsafe."],["working at height","travail en hauteur","Working at height is regulated."],["confined space","espace confiné","A confined space permit."],["lockout / tagout","consignation","LOTO is required."],["fire extinguisher","extincteur","Where is the extinguisher?"],["emergency exit","issue de secours","Keep exits clear."],["assembly point","point de rassemblement","Go to the assembly point."],["near miss","presque-accident","Report any near miss."],["inspection","inspection","The inspection passed."],["non-conformity","non-conformité","A non-conformity was raised."],["corrective action","action corrective","Corrective action is needed."],["root cause","cause racine","Find the root cause."],["hold point","point d'arrêt","Stop at the hold point."],["as-built","conforme à l'exécution","Update the as-built drawings."],["sign-off","validation finale","We need sign-off."]],"sents":[["All personnel must wear a helmet and safety boots on site.","Tout le personnel doit porter un casque et des chaussures de sécurité sur site."],["A risk assessment must be completed before work starts.","Une évaluation des risques doit être réalisée avant le début des travaux."],["The incident was reported and the area was made safe.","L'incident a été signalé et la zone a été sécurisée."],["The inspection revealed several non-conformities.","L'inspection a révélé plusieurs non-conformités."],["We have implemented corrective actions to prevent recurrence.","Nous avons mis en œuvre des actions correctives pour éviter la récidive."],["No work may proceed beyond the hold point until it is signed off.","Aucun travail ne peut continuer au-delà du point d'arrêt avant validation."]],"lv":"B2","can":"Je parle de sécurité et de qualité sur un chantier."},{"t":"Style soutenu : nominalisation et structures concises","rules":[{"h":"Nominalisation et voix impersonnelle","x":"Le style soutenu (écrit académique, professionnel) remplace les verbes par des **noms abstraits** et utilise des structures impersonnelles.\n*They decided to postpone → The decision to postpone…* ; *We analysed the data and found → Analysis of the data revealed…* ; *because prices rose → owing to the rise in prices.*\nImpersonnel : **It is widely believed that… / It has been argued that… / There appears to be…**\nSujets abstraits : *The findings suggest…, The report highlights…, This approach offers…*\nÉviter les contractions et les phrasal verbs ; préférer *investigate* à *look into*, *increase* à *go up*.","ex":[["The rise in unemployment led to social unrest.","La hausse du chômage a entraîné des troubles sociaux."],["It is widely believed that the policy has failed.","On croit largement que la politique a échoué."],["The report highlights several shortcomings.","Le rapport met en évidence plusieurs lacunes."]],"q":[["Formal version of « The company looked into the problem »:",["The company investigated the problem.","The company looked it over.","The company checked it out.","The company went into it."],"investigate est plus soutenu que look into."],["Nominalisation of « They failed to agree »:",["Their failure to agree","Their failing agree","Their failed agreement","They failure"],"Their failure to agree."],["Which is the most formal?",["It is widely acknowledged that…","Everybody knows that…","People say that…","They all think that…"],"Structure impersonnelle soutenue."]]},{"h":"Cohésion et enchaînements avancés","x":"**Anaphore** : *This / Such / The latter / The former / That said…* ; **Concession** : *granted that, admittedly, albeit* (*albeit slowly*), *notwithstanding*.\n**Conséquence** : *thereby, hence, thus, accordingly, it follows that…*\n**Ajout** : *what is more, not to mention, let alone* (*he can't read, let alone write*).\n**Condition** : *provided / providing that, on the understanding that, so long as*.\n**Exemple / précision** : *notably, in particular, that is, i.e., e.g.*\n**Contraste** : *conversely, by contrast, whereas, while*.","ex":[["The plan, albeit ambitious, is realistic.","Le plan, bien qu'ambitieux, est réaliste."],["He can't cook, let alone bake.","Il ne sait pas cuisiner, encore moins faire de la pâtisserie."],["Admittedly, the results are mixed.","Certes, les résultats sont mitigés."]],"q":[["The project was successful, ___ slowly.",["albeit","despite","unless","whereas"],"albeit = quoique."],["The costs fell, ___ improving margins.",["thereby","therefore to","hence of","thus to"],"thereby + -ing : ce qui permet de…"],["He can't speak French, ___ write it.",["let alone","even though","as well","in case"],"let alone = encore moins."]]}],"words":[["to highlight","mettre en évidence","The report highlights risks."],["to undermine","saper","It undermines trust."],["to alleviate","atténuer","To alleviate pressure."],["to exacerbate","aggraver","It exacerbates the problem."],["to mitigate","atténuer (un risque)","Mitigate the risks."],["to foster","encourager, favoriser","Foster innovation."],["to hinder","entraver","Delays hinder progress."],["to underpin","sous-tendre","What underpins the theory?"],["to entail","impliquer, entraîner","It entails risks."],["to warrant","justifier","It warrants attention."],["noteworthy","remarquable","A noteworthy result."],["substantial","considérable","A substantial increase."],["negligible","négligeable","A negligible effect."],["inevitable","inévitable","A delay was inevitable."],["albeit","quoique","Albeit briefly."],["notwithstanding","nonobstant","Notwithstanding the cost."],["whereby","par lequel","A system whereby…"],["henceforth","désormais","Henceforth, all staff must…"],["thereby","de ce fait","Thereby reducing costs."],["hence","d'où","Hence the delay."]],"sents":[["The decision, albeit controversial, was widely supported.","La décision, bien que controversée, a été largement soutenue."],["Such measures could exacerbate existing inequalities.","De telles mesures pourraient aggraver les inégalités existantes."],["The new system aims to foster collaboration across teams.","Le nouveau système vise à favoriser la collaboration entre les équipes."],["It follows that further investigation is warranted.","Il s'ensuit qu'une enquête plus poussée est justifiée."],["Notwithstanding these concerns, the project went ahead.","Malgré ces réserves, le projet est allé de l'avant."],["The findings undermine the assumption that costs will fall.","Les conclusions remettent en cause l'hypothèse d'une baisse des coûts."]],"lv":"C1","can":"J'écris dans un style soutenu et concis."},{"t":"Subjonctif, ellipse et emphase avancée","rules":[{"h":"Le subjonctif anglais et les structures mandatives","x":"Après les verbes et adjectifs d'ordre, de recommandation, de nécessité (**demand, insist, recommend, suggest, propose, essential, vital, important**) on emploie **that + sujet + base** (subjonctif) : *I suggest that he leave early. It is essential that she be present.*\nBritannique : aussi **should** : *I suggest that he should leave.*\n**If I were / were it not for / as if** : *He talks as if he were the boss.* **I'd rather you did…** (préférence sur autrui) : *I'd rather you stayed.* **It's high time** + passé : *It's high time we left.*\n**Suppose / supposing / what if**.","ex":[["The doctor recommended that she rest for a week.","Le médecin a recommandé qu'elle se repose une semaine."],["It is vital that every employee be informed.","Il est vital que chaque employé soit informé."],["I'd rather you didn't smoke here.","Je préférerais que vous ne fumiez pas ici."]],"q":[["It is essential that he ___ on time.",["arrive","arrives","arrived","will arrive"],"Subjonctif : base sans s."],["He talks as if he ___ the boss.",["were","is","has been","will be"],"as if + were (irréel)."],["It's high time we ___ a decision.",["made","make","will make","have make"],"It's high time + past simple."]]},{"h":"Ellipse, substitution et inversion avancée","x":"**Ellipse** : on évite les répétitions : *She can swim and (she can) dance.* **Substitution** : **do so** (*He asked me to leave, and I did so*), **one / ones** (*the red one*), **so / not** (*I think so / I hope not*).\n**Inversion** : après *so / neither / nor* : *So do I. Neither can he.* **Conditionnelle inversée** : *Had I known…, Were he here…, Should you need…* **Après adverbe négatif** : *Little did we know… Not only did he… Scarcely had I… when…* **Inversion locative** : *Here comes the bus. Down the road ran the dog.*\n**Emphase** : *do/does/did* + base ; *It was … that …* ; *What I need is…* ; *The very thing…*","ex":[["Not only did she win, but she also broke the record.","Non seulement elle a gagné mais elle a aussi battu le record."],["I asked him to leave and he did so.","Je lui ai demandé de partir et il l'a fait."],["Were I in your position, I would accept.","Si j'étais à ta place, j'accepterais."]],"q":[["___ had I sat down than the phone rang.",["No sooner","Hardly","Only","Rarely"],"No sooner … than."],["A: I think it will rain. B: I ___.",["hope not","don't hope","not hope","hope no"],"hope not = j'espère que non."],["She loves jazz and so ___ I.",["do","am","have","did"],"So + auxiliaire + sujet."]]}],"words":[["to insist","insister","He insisted that we stay."],["to demand","exiger","They demand that…"],["to recommend","recommander","I recommend that you wait."],["essential","essentiel","It is essential that…"],["vital","vital","A vital decision."],["rather","plutôt","I'd rather stay."],["high time","grand temps","High time to leave."],["scarcely","à peine","Scarcely had we begun."],["hardly","à peine","Hardly anyone came."],["barely","tout juste","
