He barely spoke."],["seldom","rarement","Seldom seen."],["whereas","alors que","He's tall whereas she's short."],["suppose","supposons","Suppose it fails."],["provided","pourvu que","Provided it's safe."],["as though","comme si","As though nothing had happened."],["nor","ni","Nor do I."],["so as to","afin de","So as to avoid delays."],["to do so","le faire","He did so."],["one","celui, celle","The blue one."],["the latter","ce dernier","The latter is cheaper."]],"sents":[["The committee insisted that the report be submitted by Friday.","Le comité a insisté pour que le rapport soit remis vendredi."],["Scarcely had we left when the storm began.","À peine étions-nous partis que l'orage a éclaté."],["I'd rather you told me the truth.","Je préférerais que tu me dises la vérité."],["Nor did they explain the delay.","Et ils n'ont pas non plus expliqué le retard."],["It is high time the government acted.","Il est grand temps que le gouvernement agisse."],["She behaves as though she owned the place.","Elle se comporte comme si elle était chez elle."]],"lv":"C1","can":"Je maîtrise les structures avancées du subjonctif et de l'inversion."},{"t":"Idiomes et expressions de haut niveau","rules":[{"h":"Expressions idiomatiques fréquentes","x":"**It's a long shot** : c'est peu probable. **To be on the fence** : hésiter. **To read between the lines** : lire entre les lignes. **To cut to the chase** : aller droit au but. **A storm in a teacup** : une tempête dans un verre d'eau. **To bite off more than you can chew** : voir trop grand. **To hit the nail on the head** : mettre le doigt dessus. **The tip of the iceberg** : la partie émergée. **To have a lot on your plate** : avoir beaucoup à faire. **To go the extra mile** : faire un effort supplémentaire. **To be in the same boat** : être dans la même situation.\nÀ l'oral, ils donnent du naturel ; à l'écrit, à utiliser avec parcimonie.","ex":[["Let's cut to the chase: what is the budget?","Allons droit au but : quel est le budget ?"],   else if(a==='idbrest'){if(rest){S=rest;rest=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}S=load();G.toast('Progression restaurée','');view={n:'home'};hist=[];render()}}
  else if(a==='idbno'){rest=null;render()}
  else if(a==='trtato'){const lv=U[prog()-1].lv,L=lv[0]==='A'?['A']:lv==='C1'?['B','C']:['A','B'],n=w=>w.split(' ').length,lev=s=>n(s)<=6?'A':n(s)<=10?'B':'C';const pool=shuffle(TATO.filter(s=>L.indexOf(lev(s[0]))>=0).slice()).slice(0,10);startQuizItems('Phrases authentiques',pool.map((s,i)=>{const q=(hasEn()&&i%2)?qDict(s):qBuild(s);q.info+='<div class="muted" style="font-size:12px;margin-top:6px">Phrase Tatoeba (CC BY 2.0 FR)</div>';return q}))}
  else if(a==='hvtog'){S.hv=S.hv===0?1:0;touch();const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==='acc'){S.acc=b.dataset.v;touch();const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==='rate'){S.rate=Number(b.dataset.v);touch();const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(a==='stats')go({n:'stats'});
  else if(a==='rec')go({n:'rec',u:1});
  else if(a==='reps')go({n:'reps'});
  else if(a==='trread')go({n:'read'});
  else if(a==='trwritep')go({n:'write'});
  else if(a==='errwork'){const ws=errWords().slice(0,20);startQuizItems('Mes erreurs',ws.map(w=>wordQ(w,1)))}
  else if(a==='report'){const st=run.steps[run.i],it=curQ(st);S.rep.push({i:it.info,d:new Date().toLocaleDateString('fr-FR')});touch();b.textContent='Signalé, merci';b.disabled=true}
  else if(a==='repcopy'){const t=S.rep.map(x=>x.i.replace(/<[^>]+>/g,' ')).join('\n');try{navigator.clipboard.writeText(t);document.getElementById('repmsg').textContent='Copié.'}catch(e){document.getElementById('repmsg').textContent='Copie impossible.'}}
  else if(a==='repclear'){S.rep=[];touch();render()}
  else if(a==='readopen'){const i=Number(b.dataset.i),t=READ[i];const items=t.q.map(q=>mcq('<span class="label">Compréhension</span><div style="font-size:18px;font-weight:600;margin-top:8px">'+esc(q[0])+'</div>',q[1][0],q[1].slice(1),{en:true,info:'<div class="note">'+esc(q[2])+'</div>'}));startRun([{t:'passage',title:t.t,x:t.x},{t:'quiz',title:t.t,items:items,rd:i}],{title:t.t})}
  else if(a==='writeopen')go({n:'writep',i:Number(b.dataset.i),txt:'',chk:null,lt:'',ltw:null});
  else if(a==='writeback'){view=hist.length?hist.pop():{n:'write'};render()}
  else if(a==='writechk'){const t=WRITE[view.i],tx=document.getElementById('wtx').value,low=tx.toLowerCase();const f=t.need.map(n=>n.some(x=>low.indexOf(x.toLowerCase())>=0));const ok=f.filter(Boolean).length;view.txt=tx;view.chk={f:f,ok:ok,an:wAnalyse(tx,t.model)};G.ans(ok*2>=t.need.length);S.wr['w'+view.i]=Math.max(S.wr['w'+view.i]||0,ok);touch();render();window.scrollTo(0,document.body.scrollHeight)}
  else if(a==='recgo')recToggle(b.dataset.k);
  else if(a==='recplay'){const au=new Audio(recUrl[b.dataset.k]);au.play().catch(()=>{})}
  else if(a==='lib')go({n:'lib',q:''});
  else if(a==='rulesref')go({n:'rulesref',q:''});
  else if(a==='objedit')go({n:'obj'});
  else if(a==='backup')go({n:'backup'});
  else if(a==='bkcopy'){S.bk=Date.now();touch();const t=document.getElementById('bk');try{navigator.clipboard.writeText(t.value);document.getElementById('bkmsg').textContent='Copié.'}catch(e){t.select();document.getElementById('bkmsg').textContent='Sélectionné : copie-le.'}}
  else if(a==='bkload'){try{const o=JSON.parse(document.getElementById('bk').value);S=Object.assign({cards:{},log:{},guide:{done:{},pos:{}},obj:{u:6},acc:'en-GB',rate:.9,err:{}},o);touch();document.getElementById('bkmsg').textContent='Progression restaurée.'}catch(e){document.getElementById('bkmsg').textContent='Texte invalide.'}}
  else if(a==='reset'){if(confirm('Effacer toute ta progression ?')){S={cards:{},log:{},guide:{done:{},pos:{}},obj:{u:6},acc:'en-GB',rate:.9,err:{},tr:null};touch();view={n:'home'};hist=[];render()}}
  else if(a==='runquit'){run=null;speechCancel();const v=hist.length?hist.pop():{n:'home'};view=(v.n==='run'||v.n==='res')?{n:'home'}:v;render()}
  else if(a==='stepnext')stepNext();
  else if(a==='qpick'){const st=run.steps[run.i],it=curQ(st);if(st.sel!==null)return;st.sel=Number(b.dataset.v);answer(st,st.sel===it.a);render()}
  else if(a==='qtype'){const st=run.steps[run.i],it=curQ(st);if(st.sel!==null)return;const v=document.getElementById('tin').value;st.tv=v;const n=norm(v);const ok=n===it.ans||(it.alt&&n===it.alt);st.sel=ok?1:0;answer(st,ok);render()}
  else if(a==='qbp'){const it=curQ(run.steps[run.i]);it.chosen.push(Number(b.dataset.id));render()}
  else if(a==='qbu'){const it=curQ(run.steps[run.i]);it.chosen=it.chosen.filter(x=>x!==Number(b.dataset.id));render()}
  else if(a==='qbclr'){curQ(run.steps[run.i]).chosen=[];render()}
  else if(a==='qbchk'){const st=run.steps[run.i],it=curQ(st);const ok=it.chosen.every((id,j)=>it.tiles.find(x=>x.id===id).w===it.words[j]);st.sel=ok?1:0;answer(st,ok);render()}
  else if(a==='qnext'){const st=run.steps[run.i];st.qi++;st.sel=null;st.tv='';st.show=false;if(st.qi>=st.items.length)stepNext();else{render();window.scrollTo(0,0)}}
}
function speechCancel(){try{speechSynthesis.cancel()}catch(e){}}
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;act(b.dataset.act,b)});
app.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='tra'||id==='trb'){let a=Number($('#tra').value),b=Number($('#trb').value);if(b<a){if(id==='tra')b=a;else a=b}trSet(a,b);const y=window.scrollY;render();window.scrollTo(0,y)}
  else if(id==='recu'){view.u=Number(e.target.value);render()}
  else if(id==='objsel'){S.obj.u=Number(e.target.value);touch()}
});
app.addEventListener('input',e=>{
  if(e.target.id==='lq'){view.q=e.target.value;document.getElementById('llist').innerHTML=libList(view.q.toLowerCase())}
  else if(e.target.id==='rq'){view.q=e.target.value;document.getElementById('rlist').innerHTML=rulesList(view.q.toLowerCase())}
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='tin'){e.preventDefault();act('qtype')}});
history.replaceState({},'');
WK.init(()=>S.wk,c=>{S.wk=c;touch()});
FSRS.sink=(id,g)=>{const r=S.rl||(S.rl=[]);r.push([id,today(),g]);if(r.length>4000)r.splice(0,r.length-4000)};
if(S.fsw&&S.fsw.w)FSRS.setW(S.fsw.w);setTimeout(()=>{try{if(FSRS.auto(S,S.rl))touch()}catch(e){}},3000);
if(!hadLocal)G.backupGet(KEY).then(b=>{if(b&&b.cards&&Object.keys(b.cards).length&&!Object.keys(S.cards).length){rest=b;if(view.n==='home')render()}});
G.init({unit:'unité',busy:()=>view.n==='run'||view.n==='place',S:()=>S,save:()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},solid:()=>WORDS.filter(wordSolid).length,lessons:()=>Object.keys(S.guide.done).length,total:()=>GN,found:()=>!!(S.place&&S.place.t),topErr:topFault,foundName:'Niveau évalué',foundTxt:'Passer le test de niveau'});
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){try{navigator.serviceWorker.register('sw.js')}catch(e){}}

</script>
